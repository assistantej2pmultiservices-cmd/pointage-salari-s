<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointage salarié</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 6px;
  font-size: 16px;
}

button {
  margin-top: 25px;
  border: 0;
  border-radius: 6px;
  background: #1a73e8;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

#gps,
#message,
#attente {
  margin-top: 15px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>Pointage salarié</h1>

<form id="form">

<label for="nom">Nom</label>
<input type="text" id="nom" required>

<label for="prenom">Prénom</label>
<input type="text" id="prenom" required>

<label for="site">Site</label>
<input type="text" id="site" required>

<label for="type">Type de pointage</label>
<select id="type" required>
  <option value="">Choisir</option>
  <option value="Heure de début de prestation">
    Heure de début de prestation
  </option>
  <option value="Heure de fin de prestation">
    Heure de fin de prestation
  </option>
</select>

<div id="gps">Recherche du GPS...</div>

<button type="submit" id="bouton">
ENREGISTRER LE POINTAGE
</button>

<div id="message"></div>
<div id="attente"></div>

</form>

</div>

<script>

/* =========================
   GOOGLE APPS SCRIPT
========================= */

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";


/* =========================
   GPS
========================= */

let gps = {
  latitude: "",
  longitude: "",
  precision: ""
};

function obtenirGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gps").textContent =
      "GPS non disponible";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      gps.latitude =
        position.coords.latitude;

      gps.longitude =
        position.coords.longitude;

      gps.precision =
        position.coords.accuracy;

      document.getElementById("gps").textContent =
        "GPS activé ✔";

    },

    function() {

      document.getElementById("gps").textContent =
        "GPS non autorisé";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}


/* =========================
   STOCKAGE HORS CONNEXION
========================= */

function chargerPointages() {

  return JSON.parse(
    localStorage.getItem("pointages") || "[]"
  );

}


function sauvegarderPointages(pointages) {

  localStorage.setItem(
    "pointages",
    JSON.stringify(pointages)
  );

}


function afficherAttente() {

  const total =
    chargerPointages().length;

  const element =
    document.getElementById("attente");

  if (total > 0) {

    element.textContent =
      total + " pointage(s) en attente d'envoi.";

  } else {

    element.textContent = "";

  }
}


/* =========================
   ENVOI GOOGLE SHEETS
========================= */

async function envoyerPointage(pointage) {

  await fetch(SERVEUR, {

    method: "POST",

    mode: "no-cors",

    headers: {
      "Content-Type":
        "text/plain;charset=utf-8"
    },

    body: JSON.stringify(pointage)

  });

}


/* =========================
   SYNCHRONISATION
========================= */

async function synchroniser() {

  if (!navigator.onLine) {

    afficherAttente();
    return;

  }

  let pointages =
    chargerPointages();

  if (pointages.length === 0) {

    afficherAttente();
    return;

  }

  let restants = [];

  for (const pointage of pointages) {

    try {

      await envoyerPointage(pointage);

    } catch (erreur) {

      restants.push(pointage);

    }

  }

  sauvegarderPointages(restants);

  afficherAttente();

}


/* =========================
   FORMULAIRE
========================= */

document
.getElementById("form")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const bouton =
    document.getElementById("bouton");

  const message =
    document.getElementById("message");

  bouton.disabled = true;

  message.textContent = "";


  /* Date et heure automatiques */

  const maintenant =
    new Date();


  const pointage = {

    dateHeure:
      maintenant.toISOString(),

    nom:
      document.getElementById("nom")
      .value.trim(),

    prenom:
      document.getElementById("prenom")
      .value.trim(),

    site:
      document.getElementById("site")
      .value.trim(),

    type:
      document.getElementById("type")
      .value,

    latitude:
      gps.latitude,

    longitude:
      gps.longitude,

    precision:
      gps.precision

  };


  /* Sauvegarde locale immédiate */

  let pointages =
    chargerPointages();

  pointages.push(pointage);

  sauvegarderPointages(pointages);


  /* Envoi si Internet disponible */

  if (navigator.onLine) {

    await synchroniser();

    message.textContent =
      "Pointage enregistré et envoyé ✔";

  } else {

    message.textContent =
      "Hors connexion : pointage sauvegardé ✔";

  }

  message.style.color = "green";


  document
    .getElementById("form")
    .reset();


  afficherAttente();

  bouton.disabled = false;

});


/* =========================
   INTERNET RETROUVÉ
========================= */

window.addEventListener(
  "online",
  function() {

    synchroniser();

  }
);


/* =========================
   DÉMARRAGE
========================= */

obtenirGPS();

afficherAttente();

synchroniser();


/* =========================
   MODE HORS CONNEXION
========================= */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker
      .register("./sw.js")
      .catch(function(erreur) {

        console.log(
          "Service Worker :",
          erreur
        );

      });

  });

}

</script>

</body>
</html>
