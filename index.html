<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0f766e"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="Pointage"
>

<title>Pointage</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

.header {
  background: #0f766e;
  color: white;
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 15px;
}

.header h1 {
  margin: 0 0 6px 0;
  font-size: 28px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input {
  width: 100%;
  min-height: 52px;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  font-size: 18px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  min-height: 68px;
  border: 0;
  border-radius: 16px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.btn-start {
  background: #16a34a;
}

.btn-end {
  background: #dc2626;
}

.status {
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

.online {
  background: #dcfce7;
  color: #166534;
}

.offline {
  background: #fef3c7;
  color: #92400e;
}

.warning {
  background: #fee2e2;
  color: #991b1b;
}

.gps {
  color: #475569;
  line-height: 1.7;
}

.history-title {
  font-weight: bold;
  font-size: 19px;
  margin-bottom: 10px;
}

.pointage {
  padding: 13px 0;
  border-bottom: 1px solid #e2e8f0;
}

.pointage:last-child {
  border-bottom: none;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
  margin-top: 4px;
}

.start {
  background: #dcfce7;
  color: #166534;
}

.complete {
  background: #dbeafe;
  color: #1e40af;
}

.pending {
  background: #fef3c7;
  color: #92400e;
}

.small {
  color: #64748b;
  font-size: 13px;
  line-height: 1.7;
}

</style>

</head>


<body>


<div class="container">


  <!-- ==================================================
       EN-TÊTE
       ================================================== -->

  <div class="header">

    <h1>POINTAGE</h1>

    <div>
      Enregistrement automatique
    </div>

  </div>


  <!-- ==================================================
       STATUT
       ================================================== -->

  <div
    id="status"
    class="status"
  >
    Connexion...
  </div>


  <!-- ==================================================
       FORMULAIRE
       ================================================== -->

  <div class="card">


    <label for="nom">
      NOM
    </label>

    <input
      id="nom"
      type="text"
      placeholder="Votre nom"
      autocomplete="family-name"
    >


    <label for="prenom">
      PRÉNOM
    </label>

    <input
      id="prenom"
      type="text"
      placeholder="Votre prénom"
      autocomplete="given-name"
    >


    <label for="site">
      SITE D'INTERVENTION
    </label>

    <input
      id="site"
      type="text"
      placeholder="Site d'intervention"
    >


  </div>


  <!-- ==================================================
       BOUTONS
       ================================================== -->

  <div class="card">


    <button
      id="btnDebut"
      class="btn-start"
      type="button"
      onclick="fairePointage('Heure de début de prestation')"
    >
      🟢 HEURE DE DÉBUT DE PRESTATION
    </button>


    <button
      id="btnFin"
      class="btn-end"
      type="button"
      onclick="fairePointage('Heure de fin de prestation')"
    >
      🔴 HEURE DE FIN DE PRESTATION
    </button>


  </div>


  <!-- ==================================================
       GPS
       ================================================== -->

  <div class="card">

    <div class="history-title">
      📍 Position GPS
    </div>

    <div
      id="gps"
      class="gps"
    >
      Recherche de la position...
    </div>

  </div>


  <!-- ==================================================
       HISTORIQUE
       ================================================== -->

  <div class="card">

    <div class="history-title">
      📋 Derniers pointages
    </div>

    <div id="historique">
      Aucun pointage.
    </div>

  </div>


</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const URL_GOOGLE_SHEETS =
"https://script.google.com/macros/s/AKfycbz4HpbPBEMQBk3ApqjRVQmRAXqQmamlAj2eQEolYRyhpl41Ccy-Q-kr-5H7vinhC9j1kA/exec";


/* =====================================================
   STOCKAGE LOCAL
   ===================================================== */

const STORAGE_KEY =
"pointages";


/* =====================================================
   ÉLÉMENTS
   ===================================================== */

const nomInput =
document.getElementById("nom");

const prenomInput =
document.getElementById("prenom");

const siteInput =
document.getElementById("site");

const statusElement =
document.getElementById("status");

const gpsElement =
document.getElementById("gps");

const historiqueElement =
document.getElementById("historique");

const btnDebut =
document.getElementById("btnDebut");

const btnFin =
document.getElementById("btnFin");


/* =====================================================
   STOCKAGE LOCAL
   ===================================================== */

function getPointages() {

  try {

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

  } catch (e) {

    return [];

  }

}


function savePointages(pointages) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(pointages)
  );

}


/* =====================================================
   ID UNIQUE
   ===================================================== */

function creerId() {

  return (

    "POINTAGE-" +

    Date.now() +

    "-" +

    Math.random()
      .toString(36)
      .substring(2, 10)

  );

}


/* =====================================================
   CONNEXION
   ===================================================== */

function actualiserConnexion() {

  if (navigator.onLine) {

    statusElement.textContent =
      "🟢 CONNECTÉ — enregistrement automatique";

    statusElement.className =
      "status online";

    synchroniser();

  } else {

    statusElement.textContent =
      "🟠 HORS CONNEXION — enregistrement automatique";

    statusElement.className =
      "status offline";

  }

}


window.addEventListener(
  "online",
  actualiserConnexion
);


window.addEventListener(
  "offline",
  actualiserConnexion
);


document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      synchroniser();

    }

  }
);


/* =====================================================
   GPS
   ===================================================== */

function obtenirGPS() {

  return new Promise(
    function(resolve) {

      if (
        !navigator.geolocation
      ) {

        gpsElement.innerHTML =
          "⚠️ GPS non disponible.<br>" +
          "Le pointage sera quand même enregistré.";

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const gps = {

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            precision:
              position.coords.accuracy

          };


          gpsElement.innerHTML =

            "Latitude : " +

            gps.latitude.toFixed(6) +

            "<br>" +

            "Longitude : " +

            gps.longitude.toFixed(6) +

            "<br>" +

            "Précision : environ " +

            Math.round(
              gps.precision
            ) +

            " m";


          resolve(gps);

        },


        function() {

          gpsElement.innerHTML =
            "⚠️ GPS indisponible.<br>" +
            "Le pointage sera quand même enregistré.";

          resolve(null);

        },


        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            300000

        }

      );

    }
  );

}


/* =====================================================
   POINTAGE
   ===================================================== */

async function fairePointage(type) {


  const nom =
    nomInput.value.trim();


  const prenom =
    prenomInput.value.trim();


  const site =
    siteInput.value.trim();


  /*
   * AUCUN alert().
   *
   * Les messages sont affichés
   * directement dans la page.
   */


  if (!nom) {

    statusElement.textContent =
      "⚠️ Saisissez le NOM.";

    nomInput.focus();

    return;

  }


  if (!prenom) {

    statusElement.textContent =
      "⚠️ Saisissez le PRÉNOM.";

    prenomInput.focus();

    return;

  }


  if (!site) {

    statusElement.textContent =
      "⚠️ Saisissez le SITE.";

    siteInput.focus();

    return;

  }


  btnDebut.disabled = true;
  btnFin.disabled = true;


  try {


    const gps =
      await obtenirGPS();


    const maintenant =
      Date.now();


    /* =================================================
       DÉBUT
       ================================================= */

    if (
      type ===
      "Heure de début de prestation"
    ) {


      const pointage = {

        id:
          creerId(),

        dateHeureMs:
          maintenant,

        nom:
          nom,

        prenom:
          prenom,

        site:
          site,

        type:
          type,

        latitude:
          gps
            ? gps.latitude
            : "",

        longitude:
          gps
            ? gps.longitude
            : "",

        precision:
          gps
            ? gps.precision
            : "",

        commune:
          "",

        debutEnvoye:
          false,

        finDateHeureMs:
          null,

        finLatitude:
          "",

        finLongitude:
          "",

        finPrecision:
          "",

        finEnvoyee:
          false

      };


      /*
       * Enregistrement immédiat
       * sur le téléphone.
       */

      const pointages =
        getPointages();


      pointages.push(
        pointage
      );


      savePointages(
        pointages
      );


      afficherHistorique();


      /*
       * Envoi immédiat si Internet.
       */

      if (navigator.onLine) {

        try {

          await envoyerDebut(
            pointage
          );

        } catch (error) {

          console.error(
            "Envoi début :",
            error
          );

        }

      }


      if (
        pointage.debutEnvoye
      ) {

        statusElement.textContent =
          "✅ DÉBUT ENREGISTRÉ AUTOMATIQUEMENT";

      } else {

        statusElement.textContent =
          "✅ DÉBUT ENREGISTRÉ — synchronisation en attente";

      }


    }


    /* =================================================
       FIN
       ================================================= */

    else {


      const pointages =
        getPointages();


      let debut =
        null;


      /*
       * Recherche du dernier début
       * encore ouvert pour cette personne
       * et ce site.
       */

      for (
        let i =
          pointages.length - 1;

        i >= 0;

        i--
      ) {


        const p =
          pointages[i];


        if (

          p.nom === nom &&

          p.prenom === prenom &&

          p.site === site &&

          p.type ===
            "Heure de début de prestation" &&

          !p.finDateHeureMs

        ) {

          debut =
            p;

          break;

        }

      }


      if (!debut) {

        statusElement.textContent =
          "⚠️ Aucun début ouvert trouvé pour cette personne et ce site.";

        return;

      }


      /*
       * On ajoute la FIN au même
       * enregistrement local.
       */

      debut.finDateHeureMs =
        maintenant;


      debut.finLatitude =
        gps
          ? gps.latitude
          : "";


      debut.finLongitude =
        gps
          ? gps.longitude
          : "";


      debut.finPrecision =
        gps
          ? gps.precision
          : "";


      debut.finEnvoyee =
        false;


      savePointages(
        pointages
      );


      afficherHistorique();


      /*
       * Si le début n'a pas encore été
       * envoyé, on l'envoie d'abord.
       */

      if (navigator.onLine) {

        try {

          if (
            !debut.debutEnvoye
          ) {

            await envoyerDebut(
              debut
            );

          }


          await envoyerFin(
            debut
          );

        } catch (error) {

          console.error(
            "Envoi fin :",
            error
          );

        }

      }


      if (
        debut.finEnvoyee
      ) {

        statusElement.textContent =
          "✅ FIN ENREGISTRÉE AUTOMATIQUEMENT — MÊME LIGNE";

      } else {

        statusElement.textContent =
          "✅ FIN ENREGISTRÉE — synchronisation en attente";

      }

    }


  } catch (error) {

    console.error(
      "Erreur pointage :",
      error
    );


    statusElement.textContent =
      "✅ Pointage enregistré sur le téléphone — synchronisation en attente.";

  }


  btnDebut.disabled = false;
  btnFin.disabled = false;

}


/* =====================================================
   ENVOI DU DÉBUT
   ===================================================== */

async function envoyerDebut(
  pointage
) {


  /*
   * IMPORTANT :
   *
   * On utilise POST,
   * comme dans le fonctionnement
   * qui fonctionnait auparavant.
   */

  await fetch(

    URL_GOOGLE_SHEETS,

    {

      method:
        "POST",

      mode:
        "no-cors",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify({

          id:
            pointage.id,

          dateHeureMs:
            pointage.dateHeureMs,

          nom:
            pointage.nom,

          prenom:
            pointage.prenom,

          type:
            "Heure de début de prestation",

          site:
            pointage.site,

          latitude:
            pointage.latitude || "",

          longitude:
            pointage.longitude || "",

          precision:
            pointage.precision || "",

          commune:
            pointage.commune || ""

        })

    }

  );


  /*
   * Avec no-cors, le navigateur ne permet
   * pas de lire la réponse Apps Script.
   *
   * On considère donc la requête comme
   * transmise si fetch ne déclenche pas
   * d'erreur réseau.
   */

  pointage.debutEnvoye =
    true;


  const pointages =
    getPointages();


  const index =
    pointages.findIndex(
      function(p) {

        return (
          p.id ===
          pointage.id
        );

      }
    );


  if (
    index !== -1
  ) {

    pointages[index] =
      pointage;

    savePointages(
      pointages
    );

  }


  afficherHistorique();

}


/* =====================================================
   ENVOI DE LA FIN
   ===================================================== */

async function envoyerFin(
  pointage
) {


  await fetch(

    URL_GOOGLE_SHEETS,

    {

      method:
        "POST",

      mode:
        "no-cors",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify({

          id:
            pointage.id,

          dateHeureMs:
            pointage.finDateHeureMs,

          nom:
            pointage.nom,

          prenom:
            pointage.prenom,

          type:
            "Heure de fin de prestation",

          site:
            pointage.site,

          latitude:
            pointage.finLatitude || "",

          longitude:
            pointage.finLongitude || "",

          precision:
            pointage.finPrecision || "",

          commune:
            pointage.commune || ""

        })

    }

  );


  pointage.finEnvoyee =
    true;


  const pointages =
    getPointages();


  const index =
    pointages.findIndex(
      function(p) {

        return (
          p.id ===
          pointage.id
        );

      }
    );


  if (
    index !== -1
  ) {

    pointages[index] =
      pointage;

    savePointages(
      pointages
    );

  }


  afficherHistorique();

}


/* =====================================================
   SYNCHRONISATION AUTOMATIQUE
   ===================================================== */

async function synchroniser() {


  if (
    !navigator.onLine
  ) {

    return;

  }


  const pointages =
    getPointages();


  for (
    const pointage of pointages
  ) {


    try {


      /*
       * Envoyer le début
       * s'il est encore en attente.
       */

      if (

        !pointage.debutEnvoye &&

        pointage.type ===
          "Heure de début de prestation"

      ) {

        await envoyerDebut(
          pointage
        );

      }


      /*
       * Si une fin existe,
       * l'envoyer ensuite.
       */

      if (

        pointage.finDateHeureMs &&

        !pointage.finEnvoyee

      ) {


        /*
         * Le début doit exister
         * dans Google Sheets avant
         * d'envoyer la fin.
         */

        if (
          !pointage.debutEnvoye
        ) {

          await envoyerDebut(
            pointage
          );

        }


        await envoyerFin(
          pointage
        );

      }

    } catch (error) {

      console.log(
        "Synchronisation en attente.",
        error
      );

    }

  }


  afficherHistorique();

}


/* =====================================================
   HISTORIQUE
   ===================================================== */

function afficherHistorique() {


  const pointages =
    getPointages();


  if (
    !pointages.length
  ) {

    historiqueElement.innerHTML =
      "Aucun pointage.";

    return;

  }


  historiqueElement.innerHTML =

    pointages

      .slice(-10)

      .reverse()

      .map(
        function(pointage) {


          const debut =
            new Date(
              pointage.dateHeureMs
            ).toLocaleString(
              "fr-FR"
            );


          let html = "";


          html +=
            '<div class="pointage">';


          html +=
            '<span class="badge start">' +
            '🟢 DÉBUT' +
            '</span>';


          html +=
            '<br>';


          html +=
            '<strong>' +

            escapeHtml(
              pointage.nom
            ) +

            ' ' +

            escapeHtml(
              pointage.prenom
            ) +

            '</strong>';


          html +=
            '<br>' +

            escapeHtml(
              pointage.site
            );


          html +=
            '<br>' +

            '<span class="small">' +

            'Début : ' +

            debut +

            '</span>';


          if (
            pointage.finDateHeureMs
          ) {


            const fin =
              new Date(
                pointage.finDateHeureMs
              ).toLocaleString(
                "fr-FR"
              );


            html +=
              '<br>' +

              '<span class="small">' +

              'Fin : ' +

              fin +

              '</span>';


            html +=
              '<br>' +

              '<span class="badge complete">' +

              '✓ DÉBUT + FIN' +

              '</span>';


          } else {


            html +=
              '<br>' +

              '<span class="badge pending">' +

              '⏳ EN ATTENTE DE FIN' +

              '</span>';

          }


          html +=
            '</div>';


          return html;

        }
      )

      .join("");

}


/* =====================================================
   PROTECTION HTML
   ===================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   DÉMARRAGE
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    actualiserConnexion();

    afficherHistorique();

    obtenirGPS();

  }
);


/* =====================================================
   SERVICE WORKER
   ===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "./sw.js"
        )
        .catch(
          function(error) {

            console.log(
              "Service Worker :",
              error
            );

          }
        );

    }
  );

}

</script>


</body>
</html>
