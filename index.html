```html
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Pointage</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

h2{
  text-align:center;
}

#gps{
  padding:18px;
  text-align:center;
  border-radius:10px;
  margin-bottom:20px;
  background:#e8f1ff;
  font-weight:bold;
}

.ok{
  background:#e8f5e9!important;
  color:#176b20;
}

.erreur{
  background:#ffebee!important;
  color:#b00020;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
}

input,
select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

#message{
  text-align:center;
  font-weight:bold;
  margin-top:20px;
}

</style>

</head>


<body>

<div class="box">

<h2>📍 POINTAGE</h2>

<div id="gps">
📍 Recherche de votre position...
</div>


<label>NOM</label>

<input
  id="nom"
  type="text"
  autocomplete="off"
>


<label>PRÉNOM</label>

<input
  id="prenom"
  type="text"
  autocomplete="off"
>


<label>SITE D'INTERVENTION</label>

<input
  id="site"
  type="text"
  autocomplete="off"
>


<label>TYPE DE POINTAGE</label>

<select id="type">

<option value="">
-- Sélectionnez --
</option>

<option value="Heure de début de prestation">
Heure de début de prestation
</option>

<option value="Heure de fin de prestation">
Heure de fin de prestation
</option>

</select>


<div id="message"></div>

</div>


<script>


const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";


let positionGPS = null;

let communeGPS = null;

let pointageEnvoye = false;


/*
 * GPS
 */

function lancerGPS(){

  const bloc =
    document.getElementById("gps");


  if(!navigator.geolocation){

    bloc.className = "erreur";

    bloc.innerHTML =
      "⚠️ GPS non disponible.";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position){

      positionGPS = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        precision:
          position.coords.accuracy

      };


      bloc.className = "ok";

      bloc.innerHTML =
        "✅ Position GPS enregistrée";


      await rechercherCommune();

    },


    function(){

      bloc.className = "erreur";

      bloc.innerHTML =
        "⚠️ GPS indisponible.<br>" +
        "<small>" +
        "Le pointage reste possible." +
        "</small>";

    },

    {

      enableHighAccuracy:true,

      timeout:30000,

      maximumAge:0

    }

  );

}


/*
 * Commune
 */

async function rechercherCommune(){

  if(!positionGPS){

    return;

  }


  if(!navigator.onLine){

    return;

  }


  try{

    const url =
      "https://data.geopf.fr/geocodage/reverse?" +
      "lon=" +
      encodeURIComponent(
        positionGPS.longitude
      ) +
      "&lat=" +
      encodeURIComponent(
        positionGPS.latitude
      );


    const response =
      await fetch(url);


    if(!response.ok){

      return;

    }


    const data =
      await response.json();


    if(
      data &&
      data.features &&
      data.features.length
    ){

      const proprietes =
        data.features[0].properties;


      communeGPS =
        proprietes.city ||
        proprietes.municipality ||
        proprietes.label ||
        null;


      if(communeGPS){

        document.getElementById(
          "gps"
        ).innerHTML =
          "✅ Position GPS enregistrée<br>" +
          "<small>" +
          "Commune : " +
          communeGPS +
          "</small>";

      }

    }

  }catch(erreur){

    console.log(
      "Erreur commune",
      erreur
    );

  }

}


/*
 * Envoi automatique
 */

async function envoyerPointage(){

  if(pointageEnvoye){

    return;

  }


  const nom =
    document
      .getElementById("nom")
      .value
      .trim();


  const prenom =
    document
      .getElementById("prenom")
      .value
      .trim();


  const site =
    document
      .getElementById("site")
      .value
      .trim();


  const type =
    document
      .getElementById("type")
      .value;


  if(
    !nom ||
    !prenom ||
    !site ||
    !type
  ){

    return;

  }


  pointageEnvoye = true;


  /*
   * Date et heure EXACTES
   * du remplissage du formulaire.
   */

  const maintenant =
    new Date();


  const pointage = {

    date:
      maintenant.toLocaleDateString(
        "fr-FR"
      ),

    heure:
      maintenant.toLocaleTimeString(
        "fr-FR"
      ),

    dateHeure:
      maintenant.toISOString(),

    nom:
      nom,

    prenom:
      prenom,

    site:
      site,

    type:
      type,

    latitude:
      positionGPS
        ? positionGPS.latitude
        : "",

    longitude:
      positionGPS
        ? positionGPS.longitude
        : "",

    precision:
      positionGPS
        ? positionGPS.precision
        : "",

    commune:
      communeGPS ||
      "Commune non déterminée"

  };


  const message =
    document.getElementById(
      "message"
    );


  message.innerHTML =
    "⏳ Envoi du pointage...";


  try{

    await fetch(

      SERVEUR,

      {

        method:"POST",

        mode:"no-cors",

        headers:{

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(pointage)

      }

    );


    message.innerHTML =
      "✅ POINTAGE ENREGISTRÉ";


    /*
     * Nettoyage du formulaire
     */

    document.getElementById(
      "nom"
    ).value = "";


    document.getElementById(
      "prenom"
    ).value = "";


    document.getElementById(
      "site"
    ).value = "";


    document.getElementById(
      "type"
    ).value = "";


    /*
     * Permettre un nouveau pointage
     */

    pointageEnvoye = false;


  }catch(erreur){

    console.log(
      "Erreur envoi",
      erreur
    );


    message.innerHTML =
      "⚠️ Erreur lors de l'envoi.";


    pointageEnvoye = false;

  }

}


/*
 * Détection automatique lorsque
 * les 4 champs sont remplis.
 */

function verifierFormulaire(){

  const nom =
    document
      .getElementById("nom")
      .value
      .trim();


  const prenom =
    document
      .getElementById("prenom")
      .value
      .trim();


  const site =
    document
      .getElementById("site")
      .value
      .trim();


  const type =
    document
      .getElementById("type")
      .value;


  if(
    nom &&
    prenom &&
    site &&
    type
  ){

    envoyerPointage();

  }

}


/*
 * Surveillance des champs
 */

[
  "nom",
  "prenom",
  "site",
  "type"
]
.forEach(function(id){

  const element =
    document.getElementById(id);


  element.addEventListener(
    "input",
    verifierFormulaire
  );


  element.addEventListener(
    "change",
    verifierFormulaire
  );

});


/*
 * Démarrage
 */

window.addEventListener(
  "load",
  function(){

    lancerGPS();

  }
);

</script>

</body>

</html>
```
