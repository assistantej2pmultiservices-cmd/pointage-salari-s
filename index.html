<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pointage</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 15px;
  margin-top: 7px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 17px;
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 20px;
  border: 0;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  color: white;
}

#debut {
  background: #168a3a;
}

#fin {
  background: #d62828;
}

button:disabled {
  opacity: .5;
}

#message {
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>POINTAGE</h1>

<label>NOM</label>
<input id="nom" type="text" autocomplete="family-name">

<label>PRÉNOM</label>
<input id="prenom" type="text" autocomplete="given-name">

<label>SITE</label>
<input id="site" type="text">

<button id="debut" onclick="pointer('Heure de début de prestation')">
  🟢 DÉBUT DE PRESTATION
</button>

<button id="fin" onclick="pointer('Heure de fin de prestation')">
  🔴 FIN DE PRESTATION
</button>

<div id="message"></div>

</div>

<script>

const URL_GOOGLE_SHEETS =
"https://script.google.com/macros/s/AKfycbyC7LfKcxuVCyPBZF0g4KGzAi1uno5tTkBh6i9HjYj6lgJqbXwc5FlHlKQscVqS9-60/exec";

const CLE_STOCKAGE = "POINTAGES_HORS_CONNEXION_V2";


// ===============================
// RÉCUPÉRATION DES POINTAGES
// ===============================

function recupererPointages() {

  try {
    return JSON.parse(
      localStorage.getItem(CLE_STOCKAGE) || "[]"
    );
  } catch (e) {
    return [];
  }
}


// ===============================
// SAUVEGARDE LOCALE
// ===============================

function sauvegarderPointages(pointages) {

  localStorage.setItem(
    CLE_STOCKAGE,
    JSON.stringify(pointages)
  );
}


// ===============================
// ID UNIQUE
// ===============================

function creerID() {

  return "POINTAGE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10);
}


// ===============================
// POINTAGE
// ===============================

async function pointer(type) {

  const nom =
    document.getElementById("nom").value.trim();

  const prenom =
    document.getElementById("prenom").value.trim();

  const site =
    document.getElementById("site").value.trim();

  const message =
    document.getElementById("message");


  if (!nom || !prenom || !site) {

    message.textContent =
      "Veuillez remplir NOM, PRÉNOM et SITE.";

    return;
  }


  document.getElementById("debut").disabled = true;
  document.getElementById("fin").disabled = true;


  const pointage = {

    id: creerID(),

    nom: nom,

    prenom: prenom,

    type: type,

    site: site,

    dateHeureMs: Date.now(),

    latitude: "",

    longitude: "",

    precision: "",

    commune: "",

    envoye: false
  };


  // ===============================
  // GPS
  // ===============================

  if (
    navigator.geolocation &&
    location.protocol === "https:"
  ) {

    try {

      const position =
        await new Promise((resolve, reject) => {

          navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            {
              enableHighAccuracy: true,
              timeout: 8000,
              maximumAge: 60000
            }
          );

        });


      pointage.latitude =
        position.coords.latitude;

      pointage.longitude =
        position.coords.longitude;

      pointage.precision =
        position.coords.accuracy;

    } catch (e) {
      // Le pointage fonctionne même sans GPS
    }
  }


  // ===============================
  // ENREGISTREMENT LOCAL IMMÉDIAT
  // ===============================

  const pointages =
    recupererPointages();

  pointages.push(pointage);

  sauvegarderPointages(pointages);


  message.textContent =
    type === "Heure de début de prestation"
      ? "DÉBUT enregistré"
      : "FIN enregistré";


  // ===============================
  // ENVOI AUTOMATIQUE
  // ===============================

  synchroniser();


  // ===============================
  // RÉINITIALISATION DES CHAMPS
  // ===============================

  setTimeout(() => {

    document.getElementById("nom").value = "";
    document.getElementById("prenom").value = "";
    document.getElementById("site").value = "";

    document.getElementById("debut").disabled = false;
    document.getElementById("fin").disabled = false;

    message.textContent = "";

  }, 1500);
}


// ===============================
// URL D'ENVOI
// ===============================

function construireURL(p) {

  const params = new URLSearchParams();

  params.set("id", p.id);
  params.set("nom", p.nom);
  params.set("prenom", p.prenom);
  params.set("type", p.type);
  params.set("site", p.site);
  params.set("dateHeureMs", p.dateHeureMs);

  params.set("latitude", p.latitude || "");
  params.set("longitude", p.longitude || "");
  params.set("precision", p.precision || "");
  params.set("commune", p.commune || "");

  return URL_GOOGLE_SHEETS +
    "?" +
    params.toString();
}


// ===============================
// ENVOI INVISIBLE
// ===============================

function envoyer(pointage) {

  return new Promise(resolve => {

    const iframe =
      document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src =
      construireURL(pointage);

    document.body.appendChild(iframe);

    setTimeout(() => {

      iframe.remove();

      resolve(true);

    }, 3000);

  });
}


// ===============================
// SYNCHRONISATION AUTOMATIQUE
// ===============================

async function synchroniser() {

  if (!navigator.onLine) {
    return;
  }

  let pointages =
    recupererPointages();


  for (let i = 0; i < pointages.length; i++) {

    const pointage = pointages[i];

    if (pointage.envoye) {
      continue;
    }

    await envoyer(pointage);

    pointage.envoye = true;

    sauvegarderPointages(pointages);
  }


  // Nettoyage automatique
  pointages =
    recupererPointages()
      .filter(p => !p.envoye);

  sauvegarderPointages(pointages);
}


// ===============================
// RETOUR INTERNET
// ===============================

window.addEventListener(
  "online",
  synchroniser
);


// ===============================
// AU CHARGEMENT
// ===============================

window.addEventListener(
  "load",
  synchroniser
);

</script>

</body>
</html>
