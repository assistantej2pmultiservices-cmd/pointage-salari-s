<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Pointage</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 15px;
  margin-top: 7px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 17px;
}

button {
  margin-top: 25px;
  background: #1677ff;
  color: white;
  border: none;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

#message {
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
}

#attente {
  margin-top: 15px;
  text-align: center;
  color: #666;
}
</style>
</head>

<body>

<div class="container">

<h1>Pointage</h1>

<label>NOM</label>
<input id="nom"
       type="text"
       autocomplete="family-name">

<label>PRÉNOM</label>
<input id="prenom"
       type="text"
       autocomplete="given-name">

<label>TYPE DE POINTAGE</label>

<select id="type">
  <option value="">-- Choisir --</option>
  <option value="Heure de début de prestation">
    Heure de début de prestation
  </option>
  <option value="Heure de fin de prestation">
    Heure de fin de prestation
  </option>
</select>

<label>SITE</label>

<input id="site"
       type="text"
       autocomplete="organization">

<button id="bouton" onclick="pointer()">
  ENREGISTRER LE POINTAGE
</button>

<div id="message"></div>

<div id="attente"></div>

</div>

<script>

const URL_GOOGLE_SHEETS =
"https://script.google.com/macros/s/AKfycbyC7LfKcxuVCyPBZF0g4KGzAi1uno5tTkBh6i9HjYj6lgJqbXwc5FlHlKQscVqS9-60/exec";

const CLE_STOCKAGE = "POINTAGES_HORS_CONNEXION_V1";


// ===============================
// RÉCUPÉRER LES POINTAGES LOCAUX
// ===============================

function recupererPointages() {

  try {
    return JSON.parse(
      localStorage.getItem(CLE_STOCKAGE) || "[]"
    );
  } catch(e) {
    return [];
  }
}


// ===============================
// SAUVEGARDER LOCALEMENT
// ===============================

function sauvegarderPointages(pointages) {

  localStorage.setItem(
    CLE_STOCKAGE,
    JSON.stringify(pointages)
  );
}


// ===============================
// CRÉER UN ID UNIQUE
// ===============================

function creerID() {

  return "POINTAGE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10);
}


// ===============================
// ENREGISTREMENT
// ===============================

async function pointer() {

  const nom =
    document.getElementById("nom")
      .value.trim();

  const prenom =
    document.getElementById("prenom")
      .value.trim();

  const type =
    document.getElementById("type")
      .value;

  const site =
    document.getElementById("site")
      .value.trim();

  const message =
    document.getElementById("message");

  const bouton =
    document.getElementById("bouton");


  if (!nom || !prenom || !type || !site) {

    message.textContent =
      "Veuillez remplir tous les champs.";

    return;
  }


  bouton.disabled = true;

  const maintenant = Date.now();


  const pointage = {

    id: creerID(),

    nom: nom,

    prenom: prenom,

    type: type,

    site: site,

    dateHeureMs: maintenant,

    latitude: "",

    longitude: "",

    precision: "",

    commune: "",

    envoye: false
  };


  // ===============================
  // GPS SI DISPONIBLE
  // ===============================

  if (
    navigator.geolocation &&
    location.protocol === "https:"
  ) {

    try {

      const position =
        await new Promise(
          (resolve, reject) => {

            navigator.geolocation.getCurrentPosition(
              resolve,
              reject,
              {
                enableHighAccuracy: true,
                timeout: 8000,
                maximumAge: 60000
              }
            );

          }
        );

      pointage.latitude =
        position.coords.latitude;

      pointage.longitude =
        position.coords.longitude;

      pointage.precision =
        position.coords.accuracy;

    } catch(e) {
      // Le pointage continue même sans GPS
    }
  }


  // ===============================
  // SAUVEGARDE IMMÉDIATE
  // ===============================

  const pointages =
    recupererPointages();

  pointages.push(pointage);

  sauvegarderPointages(pointages);


  message.textContent =
    "Pointage enregistré.";

  document.getElementById("attente").textContent =
    "Synchronisation en cours…";


  // ===============================
  // TENTATIVE D'ENVOI
  // ===============================

  await synchroniser();


  document.getElementById("attente").textContent =
    navigator.onLine
      ? "Enregistré."
      : "Hors connexion : sera envoyé automatiquement au retour de la connexion.";


  // Nettoyage formulaire

  document.getElementById("type").value = "";

  bouton.disabled = false;
}


// ===============================
// CONSTRUIRE L'URL
// ===============================

function construireURL(p) {

  const params = new URLSearchParams();

  params.set("id", p.id);
  params.set("nom", p.nom);
  params.set("prenom", p.prenom);
  params.set("type", p.type);
  params.set("site", p.site);
  params.set("dateHeureMs", p.dateHeureMs);

  params.set("latitude", p.latitude || "");
  params.set("longitude", p.longitude || "");
  params.set("precision", p.precision || "");
  params.set("commune", p.commune || "");

  return URL_GOOGLE_SHEETS +
    "?" +
    params.toString();
}


// ===============================
// ENVOI
// ===============================

function envoyer(pointage) {

  return new Promise(resolve => {

    const iframe =
      document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src =
      construireURL(pointage);

    document.body.appendChild(iframe);

    setTimeout(() => {

      iframe.remove();

      resolve(true);

    }, 3000);

  });
}


// ===============================
// SYNCHRONISATION
// ===============================

async function synchroniser() {

  if (!navigator.onLine) {
    return;
  }

  let pointages =
    recupererPointages();

  for (let i = 0; i < pointages.length; i++) {

    const p = pointages[i];

    if (p.envoye) {
      continue;
    }

    await envoyer(p);

    p.envoye = true;

    sauvegarderPointages(pointages);
  }

  // Supprime les anciens pointages déjà envoyés

  pointages =
    recupererPointages();

  pointages =
    pointages.filter(p => !p.envoye);

  sauvegarderPointages(pointages);
}


// ===============================
// RETOUR DE CONNEXION
// ===============================

window.addEventListener(
  "online",
  synchroniser
);


// ===============================
// SYNCHRONISATION AU CHARGEMENT
// ===============================

window.addEventListener(
  "load",
  synchroniser
);

</script>

</body>
</html>
