```html
<script>

const URL_GOOGLE_SHEETS =
  "https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";

let gps = {
  latitude: "",
  longitude: "",
  precision: ""
};

function recupererGPS() {

  if (!navigator.geolocation) {
    document.getElementById("gps").textContent =
      "GPS non disponible";
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      gps.latitude = position.coords.latitude;
      gps.longitude = position.coords.longitude;
      gps.precision = position.coords.accuracy;

      document.getElementById("gps").innerHTML =
        "📍 GPS OK<br>" +
        "Latitude : " + gps.latitude.toFixed(6) +
        "<br>" +
        "Longitude : " + gps.longitude.toFixed(6);

    },

    function() {

      document.getElementById("gps").textContent =
        "⚠️ GPS indisponible";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 300000
    }
  );
}

function envoyerPointage(type, bouton) {

  const nom =
    document.getElementById("nom").value.trim();

  const prenom =
    document.getElementById("prenom").value.trim();

  const site =
    document.getElementById("site").value.trim();

  if (!nom || !prenom || !site) {
    alert("Merci de remplir NOM, PRÉNOM et SITE.");
    return;
  }

  bouton.disabled = true;

  document.getElementById("message").textContent =
    "⏳ Envoi du pointage...";

  const donnees = {

    id: "POINTAGE-" + Date.now(),

    dateHeureMs: Date.now(),

    nom: nom,

    prenom: prenom,

    site: site,

    type: type,

    latitude: gps.latitude,

    longitude: gps.longitude,

    precision: gps.precision

  };

  fetch(URL_GOOGLE_SHEETS, {

    method: "POST",

    mode: "no-cors",

    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },

    body: JSON.stringify(donnees)

  })

  .then(function() {

    document.getElementById("message").textContent =
      "✅ POINTAGE ENVOYÉ";

    bouton.disabled = false;

  })

  .catch(function(error) {

    console.error(error);

    document.getElementById("message").textContent =
      "❌ ERREUR D'ENVOI";

    bouton.disabled = false;

  });
}

recupererGPS();

</script>
```
