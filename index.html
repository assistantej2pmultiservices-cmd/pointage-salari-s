<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="POINTAGE">
  <link rel="manifest" href="./manifest.json">
  <title>POINTAGE</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9;
    }
    body {
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
    }
    .container { width: 100%; max-width: 560px; margin: 0 auto; }
    .header {
      background: #111827; color: white; border-radius: 18px;
      padding: 22px 18px; margin: 12px 0; text-align: center;
    }
    .header h1 { margin: 0; font-size: 30px; }
    .header p { margin: 8px 0 0; opacity: .8; }
    .card {
      background: white; border-radius: 18px; padding: 18px;
      margin-bottom: 14px; box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }
    label { display: block; font-weight: bold; margin-bottom: 7px; }
    input {
      width: 100%; min-height: 52px; border: 1px solid #cbd5e1;
      border-radius: 12px; padding: 12px; font-size: 18px;
      margin-bottom: 15px; background: white;
    }
    button {
      width: 100%; min-height: 68px; border: none; border-radius: 16px;
      color: white; font-size: 17px; font-weight: bold; margin-top: 10px;
      cursor: pointer; touch-action: manipulation;
    }
    button:disabled { opacity: .55; }
    .btn-start { background: #16a34a; }
    .btn-end { background: #dc2626; }
    .status {
      text-align: center; padding: 14px; border-radius: 12px;
      background: #e2e8f0; font-weight: bold; margin-bottom: 12px;
    }
    .status.online { background: #dcfce7; color: #166534; }
    .status.offline { background: #fef3c7; color: #92400e; }
    .gps { font-size: 14px; line-height: 1.6; color: #475569; word-break: break-word; }
    .history-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .pointage { border-bottom: 1px solid #e2e8f0; padding: 12px 0; font-size: 14px; }
    .pointage:last-child { border-bottom: none; }
    .badge {
      display: inline-block; padding: 5px 8px; border-radius: 8px;
      font-weight: bold; margin-bottom: 5px;
    }
    .badge.start { background: #dcfce7; color: #166534; }
    .badge.end { background: #fee2e2; color: #991b1b; }
    .small { color: #64748b; font-size: 12px; }
    .success { color: #166534; }
    .warning { color: #92400e; }
    .error { color: #991b1b; }
  </style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>POINTAGE</h1>
    <p>Enregistrement des prestations</p>
  </div>

  <div id="status" class="status">Vérification de la connexion...</div>

  <div class="card">
    <label for="nom">NOM</label>
    <input id="nom" type="text" autocomplete="family-name" placeholder="Votre nom">

    <label for="prenom">PRÉNOM</label>
    <input id="prenom" type="text" autocomplete="given-name" placeholder="Votre prénom">

    <label for="site">SITE D'INTERVENTION</label>
    <input id="site" type="text" autocomplete="organization" placeholder="Lieu d'intervention">
  </div>

  <div class="card">
    <button id="btnStart" class="btn-start" onclick="fairePointage('Heure de début de prestation')">
      🟢 HEURE DE DÉBUT DE PRESTATION
    </button>

    <button id="btnEnd" class="btn-end" onclick="fairePointage('Heure de fin de prestation')">
      🔴 HEURE DE FIN DE PRESTATION
    </button>
  </div>

  <div class="card">
    <div class="history-title">📍 Position GPS</div>
    <div id="gps" class="gps">Recherche de la position...</div>
  </div>

  <div class="card">
    <div class="history-title">📋 Derniers pointages</div>
    <div id="historique">Aucun pointage enregistré.</div>
  </div>

</div>

<script>
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbz4HpbPBEMQBk3ApqjRVQmRAXqQmamlAj2eQEolYRyhpl41Ccy-Q-kr-5H7vinhC9j1kA/exec";

const DB_NAME = "PointageDatabase";
const DB_VERSION = 1;
const STORE_NAME = "pointages";
const OLD_STORAGE_KEY = "pointages";

const nomInput = document.getElementById("nom");
const prenomInput = document.getElementById("prenom");
const siteInput = document.getElementById("site");
const gpsElement = document.getElementById("gps");
const historiqueElement = document.getElementById("historique");
const statusElement = document.getElementById("status");

let dernierePosition = null;

function ouvrirDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = function(event) {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };

    request.onsuccess = function() {
      resolve(request.result);
    };

    request.onerror = function() {
      reject(request.error);
    };
  });
}

async function enregistrerLocalement(pointage) {
  const db = await ouvrirDB();

  return new Promise((resolve, reject) => {
    const transaction = db.transaction(STORE_NAME, "readwrite");
    const store = transaction.objectStore(STORE_NAME);
    const request = store.put(pointage);

    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

async function recupererTousLesPointages() {
  const db = await ouvrirDB();

  return new Promise((resolve, reject) => {
    const transaction = db.transaction(STORE_NAME, "readonly");
    const store = transaction.objectStore(STORE_NAME);
    const request = store.getAll();

    request.onsuccess = () => {
      const result = request.result || [];
      result.sort((a, b) => Number(a.dateHeureMs) - Number(b.dateHeureMs));
      resolve(result);
    };

    request.onerror = () => reject(request.error);
  });
}

async function recupererPointagesEnAttente() {
  const tous = await recupererTousLesPointages();
  return tous.filter(pointage => !pointage.envoye);
}

function creerId() {
  return "POINTAGE-" + Date.now() + "-" +
    Math.random().toString(36).substring(2, 10);
}

async function migrerAncienStockage() {
  try {
    const ancien = localStorage.getItem(OLD_STORAGE_KEY);
    if (!ancien) return;

    const anciensPointages = JSON.parse(ancien);
    if (!Array.isArray(anciensPointages) || !anciensPointages.length) return;

    for (const pointage of anciensPointages) {
      if (!pointage.id) pointage.id = creerId();
      if (pointage.envoye === undefined) pointage.envoye = false;
      if (!pointage.dateHeureMs) pointage.dateHeureMs = Date.now();
      await enregistrerLocalement(pointage);
    }

    localStorage.removeItem(OLD_STORAGE_KEY);
  } catch (error) {
    console.error("Migration ancien stockage :", error);
  }
}

function mettreAJourConnexion() {
  if (navigator.onLine) {
    statusElement.textContent =
      "🟢 CONNECTÉ — synchronisation automatique";
    statusElement.className = "status online";
    synchroniser();
  } else {
    statusElement.textContent =
      "🟠 HORS CONNEXION — les pointages sont conservés";
    statusElement.className = "status offline";
  }
}

window.addEventListener("online", function() {
  mettreAJourConnexion();
});

window.addEventListener("offline", function() {
  mettreAJourConnexion();
});

document.addEventListener("visibilitychange", function() {
  if (!document.hidden && navigator.onLine) {
    synchroniser();
  }
});

function obtenirGPS() {
  return new Promise(resolve => {
    if (!navigator.geolocation) {
      gpsElement.innerHTML =
        "⚠️ La géolocalisation n'est pas disponible.<br>" +
        "Le pointage sera quand même enregistré.";
      resolve(null);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(position) {
        dernierePosition = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          precision: position.coords.accuracy
        };

        gpsElement.innerHTML =
          "Latitude : " + position.coords.latitude.toFixed(6) +
          "<br>Longitude : " + position.coords.longitude.toFixed(6) +
          "<br>Précision : environ " +
          Math.round(position.coords.accuracy) + " m";

        resolve(dernierePosition);
      },
      function() {
        gpsElement.innerHTML =
          "⚠️ Position GPS indisponible.<br>" +
          "Le pointage sera quand même enregistré.";
        resolve(null);
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 300000
      }
    );
  });
}

async function fairePointage(type) {
  const nom = nomInput.value.trim();
  const prenom = prenomInput.value.trim();
  const site = siteInput.value.trim();

  if (!nom) {
    alert("Veuillez saisir votre NOM.");
    nomInput.focus();
    return;
  }

  if (!prenom) {
    alert("Veuillez saisir votre PRÉNOM.");
    prenomInput.focus();
    return;
  }

  if (!site) {
    alert("Veuillez saisir le SITE D'INTERVENTION.");
    siteInput.focus();
    return;
  }

  const btnStart = document.getElementById("btnStart");
  const btnEnd = document.getElementById("btnEnd");

  btnStart.disabled = true;
  btnEnd.disabled = true;

  try {
    const gps = await obtenirGPS();

    const pointage = {
      id: creerId(),
      dateHeureMs: Date.now(),
      nom: nom,
      prenom: prenom,
      type: type,
      site: site,
      latitude: gps ? gps.latitude : "",
      longitude: gps ? gps.longitude : "",
      precision: gps ? gps.precision : "",
      commune: "",
      envoye: false
    };

    // Sauvegarde immédiate sur le téléphone.
    await enregistrerLocalement(pointage);
    await afficherHistorique();

    // Envoi immédiat si Internet est disponible.
    if (navigator.onLine) {
      await envoyerPointage(pointage);
    }

    await afficherHistorique();

    alert(
      "✅ Pointage enregistré\n\n" +
      type + "\n" +
      "Date : " +
      new Date(pointage.dateHeureMs).toLocaleString("fr-FR") +
      "\n\n" +
      (pointage.envoye
        ? "Requête envoyée à Google Sheets."
        : "Conservé sur le téléphone et sera envoyé automatiquement.")
    );

  } catch (error) {
    console.error("Pointage :", error);

    alert(
      "✅ Le pointage est conservé sur le téléphone.\n\n" +
      "Il sera envoyé automatiquement lorsque la connexion sera disponible."
    );
  } finally {
    btnStart.disabled = false;
    btnEnd.disabled = false;
  }
}

async function envoyerPointage(pointage) {
  const params = new URLSearchParams();

  params.append("id", pointage.id);
  params.append("nom", pointage.nom || "");
  params.append("prenom", pointage.prenom || "");
  params.append("type", pointage.type || "");
  params.append("site", pointage.site || "");
  params.append("latitude", pointage.latitude ?? "");
  params.append("longitude", pointage.longitude ?? "");
  params.append("precision", pointage.precision ?? "");
  params.append("commune", pointage.commune || "");
  params.append("dateHeureMs", String(pointage.dateHeureMs || Date.now()));

  try {
    // Requête "simple" compatible avec Apps Script et no-cors.
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: params
    });

    // Avec no-cors, le navigateur ne permet pas de lire
    // la réponse Apps Script.
    pointage.envoye = true;
    await enregistrerLocalement(pointage);
    await afficherHistorique();

    console.log("Pointage transmis :", pointage.id);
    return true;

  } catch (error) {
    pointage.envoye = false;
    await enregistrerLocalement(pointage);
    console.error("Erreur d'envoi :", error);
    return false;
  }
}

async function synchroniser() {
  if (!navigator.onLine) return;

  try {
    const aEnvoyer = await recupererPointagesEnAttente();

    for (const pointage of aEnvoyer) {
      const ok = await envoyerPointage(pointage);

      if (!ok) {
        // On garde les suivants pour une prochaine tentative.
        break;
      }
    }

    await afficherHistorique();
  } catch (error) {
    console.error("Synchronisation :", error);
  }
}

async function afficherHistorique() {
  try {
    const pointages = await recupererTousLesPointages();

    if (!pointages.length) {
      historiqueElement.innerHTML = "Aucun pointage enregistré.";
      return;
    }

    const derniers = pointages.slice(-10).reverse();

    historiqueElement.innerHTML = derniers.map(pointage => {
      const date = new Date(pointage.dateHeureMs)
        .toLocaleString("fr-FR");

      const debut = String(pointage.type || "")
        .toLowerCase()
        .includes("début");

      return `
        <div class="pointage">
          <div class="badge ${debut ? "start" : "end"}">
            ${debut ? "🟢 DÉBUT" : "🔴 FIN"}
          </div>
          <br>
          <strong>
            ${escapeHtml(pointage.nom)}
            ${escapeHtml(pointage.prenom)}
          </strong>
          <br>
          ${escapeHtml(pointage.site)}
          <br>
          <span class="small">${escapeHtml(date)}</span>
          <br>
          <span class="${pointage.envoye ? "success" : "warning"}">
            ${pointage.envoye
              ? "✓ Envoyé"
              : "⏳ En attente de synchronisation"}
          </span>
        </div>
      `;
    }).join("");

  } catch (error) {
    console.error("Historique :", error);
    historiqueElement.innerHTML =
      "Impossible d'afficher l'historique.";
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

window.addEventListener("load", async function() {
  await migrerAncienStockage();
  await afficherHistorique();
  mettreAJourConnexion();
  obtenirGPS();
  if (navigator.onLine) {
    synchroniser();
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Service Worker OK"))
      .catch(error => console.log("Service Worker :", error));
  });
}
</script>
</body>
</html>
