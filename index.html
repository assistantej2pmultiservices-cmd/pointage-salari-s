<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pointage salarié</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Pointage salarié</h1>

<form id="formulaire">

  <input
    type="text"
    id="nom"
    placeholder="Nom"
    required
  >

  <input
    type="text"
    id="prenom"
    placeholder="Prénom"
    required
  >

  <input
    type="text"
    id="site"
    placeholder="Site"
    required
  >

  <select id="type" required>
    <option value="">Type de pointage</option>
    <option value="ARRIVEE">Arrivée</option>
    <option value="DEPART">Départ</option>
  </select>

  <button type="submit">
    ENREGISTRER LE POINTAGE
  </button>

</form>

<div id="message"></div>

<script>

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";

let latitude = "";
let longitude = "";
let precision = "";
let commune = "";


/* GPS */

if (navigator.geolocation) {

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;
      precision = position.coords.accuracy;

      obtenirCommune(latitude, longitude);

    },

    function(error) {

      console.log("GPS non disponible");

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}


/* Commune depuis GPS */

async function obtenirCommune(lat, lon) {

  try {

    const url =
      "https://data.geopf.fr/geocodage/reverse" +
      "?lon=" + encodeURIComponent(lon) +
      "&lat=" + encodeURIComponent(lat);

    const response = await fetch(url);

    const resultat = await response.json();

    if (
      resultat.features &&
      resultat.features.length > 0
    ) {

      const p =
        resultat.features[0].properties;

      commune =
        p.city ||
        p.municipality ||
        p.label ||
        "";

    }

  } catch (error) {

    console.log("Commune non trouvée");

  }
}


/* ENVOI */

document
  .getElementById("formulaire")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const message =
      document.getElementById("message");

    const maintenant = new Date();

    const pointage = {

      dateHeure:
        maintenant.toISOString(),

      nom:
        document.getElementById("nom").value.trim(),

      prenom:
        document.getElementById("prenom").value.trim(),

      site:
        document.getElementById("site").value.trim(),

      type:
        document.getElementById("type").value,

      latitude:
        latitude,

      longitude:
        longitude,

      precision:
        precision,

      commune:
        commune

    };


    message.textContent =
      "Enregistrement en cours...";


    try {

      await fetch(SERVEUR, {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(pointage)

      });


      message.textContent =
        "✅ Pointage enregistré";

      document
        .getElementById("formulaire")
        .reset();

    }

    catch (error) {

      console.log(error);

      message.textContent =
        "❌ Erreur d'enregistrement";

    }

  });

</script>

</body>
</html>
```
