<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#2563eb">

  <title>Pointage</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 20px;
      font-size: 26px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-size: 17px;
      background: #ffffff;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 12px;
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-debut {
      background: #16a34a;
      color: white;
    }

    .btn-fin {
      background: #dc2626;
      color: white;
    }

    .btn-sync {
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      background: #e5e7eb;
    }

    .online {
      background: #dcfce7;
      color: #166534;
    }

    .offline {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      margin-top: 15px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 10px;
      font-size: 14px;
    }

    .historique {
      margin-top: 20px;
    }

    .pointage {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      font-size: 14px;
    }

    .small {
      font-size: 11px;
      color: #6b7280;
      margin-top: 5px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Pointage</h1>

    <label for="nom">NOM</label>

    <input
      id="nom"
      type="text"
      autocomplete="family-name"
      placeholder="Nom"
    >

    <label for="prenom">PRÉNOM</label>

    <input
      id="prenom"
      type="text"
      autocomplete="given-name"
      placeholder="Prénom"
    >

    <label for="site">SITE D’INTERVENTION</label>

    <input
      id="site"
      type="text"
      autocomplete="organization"
      placeholder="Site d’intervention"
    >

    <button
      id="btnDebut"
      class="btn-debut"
      onclick="fairePointage('Heure de début de prestation')"
    >
      🟢 DÉBUT DE PRESTATION
    </button>

    <button
      id="btnFin"
      class="btn-fin"
      onclick="fairePointage('Heure de fin de prestation')"
    >
      🔴 FIN DE PRESTATION
    </button>

    <button
      id="btnSync"
      class="btn-sync"
      onclick="synchroniser()"
    >
      🔄 SYNCHRONISER
    </button>

    <div
      id="statut"
      class="status"
    >
      Initialisation...
    </div>

    <div class="info">
      📱 Les pointages sont conservés automatiquement sur le téléphone.
      <br><br>
      📡 Sans Internet, ils restent en attente et sont envoyés
      automatiquement dès que la connexion revient.
    </div>

    <div class="historique">

      <h3>Historique local</h3>

      <div id="historique">
        Aucun pointage.
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   URL GOOGLE APPS SCRIPT
   NOUVEAU DEPLOIEMENT
========================================================= */

const URL_GOOGLE_SHEETS =
"https://script.google.com/macros/s/AKfycbyC7LfKcxuVCyPBZF0g4KGzAi1uno5tTkBh6i9HjYj6lgJqbXwc5FlHlKQscVqS9-60/exec";


/* =========================================================
   STOCKAGE LOCAL
========================================================= */

const CLE_POINTAGES =
"pointages_v_finale_2026";


function obtenirPointages() {

  try {

    return JSON.parse(
      localStorage.getItem(CLE_POINTAGES) || "[]"
    );

  } catch (erreur) {

    return [];
  }
}


function sauvegarderPointages(pointages) {

  localStorage.setItem(
    CLE_POINTAGES,
    JSON.stringify(pointages)
  );
}


/* =========================================================
   ID UNIQUE
========================================================= */

function genererId() {

  return (
    "POINTAGE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );
}


/* =========================================================
   STATUT
========================================================= */

function afficherStatut(
  message,
  classe
) {

  const element =
    document.getElementById("statut");

  element.textContent =
    message;

  element.className =
    "status " +
    (classe || "");
}


/* =========================================================
   CONNEXION
========================================================= */

function afficherEtatConnexion() {

  if (navigator.onLine) {

    afficherStatut(
      "🟢 Internet disponible",
      "online"
    );

  } else {

    afficherStatut(
      "📴 Hors connexion — sauvegarde locale active",
      "offline"
    );
  }
}


/* =========================================================
   GPS
========================================================= */

function obtenirGPS() {

  return new Promise(function(resolve) {

    if (!navigator.geolocation) {

      resolve({
        latitude: "",
        longitude: "",
        precision: ""
      });

      return;
    }

    navigator.geolocation.getCurrentPosition(

      function(position) {

        resolve({

          latitude:
            position.coords.latitude,

          longitude:
            position.coords.longitude,

          precision:
            position.coords.accuracy

        });

      },

      function() {

        /*
          Le pointage continue même si
          l'utilisateur refuse le GPS.
        */

        resolve({

          latitude: "",
          longitude: "",
          precision: ""

        });

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 30000
      }

    );

  });
}


/* =========================================================
   POINTAGE
========================================================= */

async function fairePointage(type) {

  const nom =
    document
      .getElementById("nom")
      .value
      .trim();

  const prenom =
    document
      .getElementById("prenom")
      .value
      .trim();

  const site =
    document
      .getElementById("site")
      .value
      .trim();


  if (!nom) {

    alert("Veuillez saisir le NOM.");

    return;
  }


  if (!prenom) {

    alert("Veuillez saisir le PRÉNOM.");

    return;
  }


  if (!site) {

    alert(
      "Veuillez saisir le SITE D’INTERVENTION."
    );

    return;
  }


  /*
    Désactivation temporaire
    pour éviter les doubles clics.
  */

  const btnDebut =
    document.getElementById("btnDebut");

  const btnFin =
    document.getElementById("btnFin");

  btnDebut.disabled = true;
  btnFin.disabled = true;


  afficherStatut(
    "📍 Récupération du GPS...",
    ""
  );


  const gps =
    await obtenirGPS();


  const maintenant =
    new Date();


  const pointage = {

    id:
      genererId(),

    dateHeureMs:
      maintenant.getTime(),

    nom:
      nom,

    prenom:
      prenom,

    site:
      site,

    type:
      type,

    latitude:
      gps.latitude,

    longitude:
      gps.longitude,

    precision:
      gps.precision,

    commune:
      "",

    debutEnvoye:
      false,

    finEnvoyee:
      false,

    creeLe:
      maintenant.toISOString()
  };


  /*
    Sauvegarde IMMÉDIATE sur le téléphone.
    Même si Internet est coupé.
  */

  let pointages =
    obtenirPointages();

  pointages.push(pointage);

  sauvegarderPointages(
    pointages
  );

  afficherHistorique();


  /*
    Tentative immédiate d'envoi.
  */

  if (navigator.onLine) {

    await synchroniser();

  } else {

    afficherStatut(
      "📴 Enregistré sur le téléphone — sera envoyé automatiquement",
      "offline"
    );
  }


  btnDebut.disabled = false;
  btnFin.disabled = false;
}


/* =========================================================
   CREATION DE L'URL
========================================================= */

function creerUrlPointage(pointage) {

  const params =
    new URLSearchParams();


  params.set(
    "nom",
    pointage.nom
  );

  params.set(
    "prenom",
    pointage.prenom
  );

  params.set(
    "site",
    pointage.site
  );

  params.set(
    "type",
    pointage.type
  );

  params.set(
    "latitude",
    pointage.latitude || ""
  );

  params.set(
    "longitude",
    pointage.longitude || ""
  );

  params.set(
    "precision",
    pointage.precision || ""
  );

  params.set(
    "commune",
    pointage.commune || ""
  );

  params.set(
    "id",
    pointage.id
  );

  params.set(
    "dateHeureMs",
    String(pointage.dateHeureMs)
  );

  params.set(
    "_cache",
    String(Date.now())
  );


  return (
    URL_GOOGLE_SHEETS +
    "?" +
    params.toString()
  );
}


/* =========================================================
   ENVOI GOOGLE
========================================================= */

async function envoyerPointage(
  pointage
) {

  const url =
    creerUrlPointage(
      pointage
    );


  const controle =
    new AbortController();


  const timeout =
    setTimeout(
      function() {

        controle.abort();

      },
      15000
    );


  try {

    /*
      no-cors :
      le navigateur n'autorise pas
      la lecture de la réponse,
      mais la requête GET est envoyée.
    */

    await fetch(
      url,
      {
        method: "GET",
        mode: "no-cors",
        cache: "no-store",
        signal: controle.signal
      }
    );


    clearTimeout(timeout);

    return true;


  } catch (erreur) {

    clearTimeout(timeout);

    return false;
  }
}


/* =========================================================
   SYNCHRONISATION
========================================================= */

let synchronisationEnCours =
false;


async function synchroniser() {

  if (
    synchronisationEnCours
  ) {

    return;
  }


  if (!navigator.onLine) {

    afficherStatut(
      "📴 Hors connexion — pointages conservés",
      "offline"
    );

    return;
  }


  synchronisationEnCours =
    true;


  let pointages =
    obtenirPointages();


  let nombreEnvoyes =
    0;


  for (
    let i = 0;
    i < pointages.length;
    i++
  ) {

    const pointage =
      pointages[i];


    let dejaEnvoye =
      false;


    if (
      pointage.type ===
      "Heure de début de prestation"
    ) {

      dejaEnvoye =
        pointage.debutEnvoye === true;

    } else {

      dejaEnvoye =
        pointage.finEnvoyee === true;
    }


    if (dejaEnvoye) {

      continue;
    }


    afficherStatut(
      "☁️ Envoi vers Google Sheets...",
      "online"
    );


    const succes =
      await envoyerPointage(
        pointage
      );


    if (!succes) {

      /*
        Internet peut avoir disparu.
        On conserve le pointage.
      */

      break;
    }


    if (
      pointage.type ===
      "Heure de début de prestation"
    ) {

      pointage.debutEnvoye =
        true;

    } else {

      pointage.finEnvoyee =
        true;
    }


    nombreEnvoyes++;


    /*
      Sauvegarde immédiatement
      après chaque envoi.
    */

    sauvegarderPointages(
      pointages
    );
  }


  synchronisationEnCours =
    false;


  afficherHistorique();


  let restant =
    pointages.filter(
      function(pointage) {

        if (
          pointage.type ===
          "Heure de début de prestation"
        ) {

          return !pointage.debutEnvoye;
        }

        return !pointage.finEnvoyee;
      }
    ).length;


  if (restant > 0) {

    afficherStatut(
      "🟠 " +
      restant +
      " pointage(s) en attente",
      ""
    );

  } else {

    afficherStatut(
      "🟢 Synchronisation terminée",
      "online"
    );
  }
}


/* =========================================================
   HISTORIQUE
========================================================= */

function afficherHistorique() {

  const zone =
    document.getElementById(
      "historique"
    );


  const pointages =
    obtenirPointages();


  if (!pointages.length) {

    zone.textContent =
      "Aucun pointage.";

    return;
  }


  const derniers =
    pointages
      .slice()
      .reverse()
      .slice(0, 20);


  zone.innerHTML = "";


  derniers.forEach(
    function(pointage) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "pointage";


      const date =
        new Date(
          pointage.dateHeureMs
        );


      let statut;


      if (
        pointage.type ===
        "Heure de début de prestation"
      ) {

        statut =
          pointage.debutEnvoye
            ? "🟢 Envoyé"
            : "🟠 En attente";

      } else {

        statut =
          pointage.finEnvoyee
            ? "🟢 Envoyé"
            : "🟠 En attente";
      }


      div.innerHTML =

        "<strong>" +
        pointage.type +
        "</strong><br>" +

        pointage.nom +
        " " +
        pointage.prenom +
        "<br>" +

        "Site : " +
        pointage.site +
        "<br>" +

        "Date : " +
        date.toLocaleString(
          "fr-FR"
        ) +
        "<br>" +

        statut +

        "<div class='small'>" +
        pointage.id +
        "</div>";


      zone.appendChild(
        div
      );

    }
  );
}


/* =========================================================
   RECONNEXION
========================================================= */

window.addEventListener(
  "online",
  function() {

    afficherStatut(
      "🟢 Connexion retrouvée — synchronisation...",
      "online"
    );

    synchroniser();
  }
);


window.addEventListener(
  "offline",
  function() {

    afficherStatut(
      "📴 Hors connexion — sauvegarde locale active",
      "offline"
    );
  }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .then(
          function() {

            console.log(
              "Service Worker actif"
            );

          }
        )
        .catch(
          function(erreur) {

            console.log(
              "Service Worker :",
              erreur
            );

          }
        );

    }
  );
}


/* =========================================================
   DEMARRAGE
========================================================= */

afficherEtatConnexion();

afficherHistorique();


if (navigator.onLine) {

  synchroniser();
}

</script>

</body>
</html>
