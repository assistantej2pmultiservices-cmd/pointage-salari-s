<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="POINTAGE"
  >

  <title>POINTAGE</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f1f5f9;
    }

    body {
      padding:
        env(safe-area-inset-top)
        12px
        env(safe-area-inset-bottom)
        12px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      background: #111827;
      color: white;
      border-radius: 18px;
      padding: 22px 18px;
      margin: 12px 0;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: 0.8;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow:
        0 3px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      min-height: 52px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font-size: 18px;
      margin-bottom: 15px;
      background: white;
    }

    button {
      width: 100%;
      min-height: 68px;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
    }

    .btn-start {
      background: #16a34a;
    }

    .btn-end {
      background: #dc2626;
    }

    .status {
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      background: #e2e8f0;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .status.online {
      background: #dcfce7;
      color: #166534;
    }

    .status.offline {
      background: #fef3c7;
      color: #92400e;
    }

    .status.sync {
      background: #dbeafe;
      color: #1e40af;
    }

    .gps {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
      word-break: break-word;
    }

    .history-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .pointage {
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 0;
      font-size: 14px;
    }

    .pointage:last-child {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .badge.start {
      background: #dcfce7;
      color: #166534;
    }

    .badge.end {
      background: #fee2e2;
      color: #991b1b;
    }

    .small {
      color: #64748b;
      font-size: 12px;
    }

    .success {
      color: #166534;
    }

    .warning {
      color: #92400e;
    }

    .error {
      color: #991b1b;
    }

    .counter {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-top: 8px;
    }

  </style>

</head>


<body>

<div class="container">


  <div class="header">

    <h1>POINTAGE</h1>

    <p>Enregistrement des prestations</p>

  </div>


  <div id="status" class="status">
    Vérification de la connexion...
  </div>


  <div class="card">

    <label for="nom">
      NOM
    </label>

    <input
      id="nom"
      type="text"
      autocomplete="family-name"
      placeholder="Votre nom"
    >


    <label for="prenom">
      PRÉNOM
    </label>

    <input
      id="prenom"
      type="text"
      autocomplete="given-name"
      placeholder="Votre prénom"
    >


    <label for="site">
      SITE D'INTERVENTION
    </label>

    <input
      id="site"
      type="text"
      autocomplete="organization"
      placeholder="Lieu d'intervention"
    >

  </div>


  <div class="card">

    <button
      id="btnStart"
      class="btn-start"
      onclick="fairePointage('Heure de début de prestation')"
    >
      🟢 HEURE DE DÉBUT DE PRESTATION
    </button>


    <button
      id="btnEnd"
      class="btn-end"
      onclick="fairePointage('Heure de fin de prestation')"
    >
      🔴 HEURE DE FIN DE PRESTATION
    </button>

  </div>


  <div class="card">

    <div class="history-title">
      📍 Position GPS
    </div>

    <div id="gps" class="gps">
      Recherche de la position...
    </div>

  </div>


  <div class="card">

    <div class="history-title">
      📋 Derniers pointages
    </div>

    <div id="historique">
      Aucun pointage enregistré.
    </div>

    <div id="counter" class="counter"></div>

  </div>


</div>


<script>


/********************************************************
 * CONFIGURATION
 ********************************************************/

const URL_GOOGLE_SHEETS =
  "https://script.google.com/macros/s/AKfycbz4HpbPBEMQBk3ApqjRVQmRAXqQmamlAj2eQEolYRyhpl41Ccy-Q-kr-5H7vinhC9j1kA/exec";


const DB_NAME = "PointageDatabase";

const DB_VERSION = 1;

const STORE_NAME = "pointages";

const OLD_STORAGE_KEY = "pointages";


/********************************************************
 * ÉLÉMENTS
 ********************************************************/

const nomInput =
  document.getElementById("nom");

const prenomInput =
  document.getElementById("prenom");

const siteInput =
  document.getElementById("site");

const gpsElement =
  document.getElementById("gps");

const historiqueElement =
  document.getElementById("historique");

const statusElement =
  document.getElementById("status");

const counterElement =
  document.getElementById("counter");

const btnStart =
  document.getElementById("btnStart");

const btnEnd =
  document.getElementById("btnEnd");


/********************************************************
 * INDEXEDDB
 ********************************************************/

let dbPromise = null;


function ouvrirDB() {

  if (dbPromise) {
    return dbPromise;
  }

  dbPromise = new Promise(function(resolve, reject) {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded =
      function(event) {

        const db =
          event.target.result;


        if (!db.objectStoreNames.contains(STORE_NAME)) {

          const store =
            db.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id"
              }
            );


          store.createIndex(
            "dateHeureMs",
            "dateHeureMs",
            {
              unique: false
            }
          );


          store.createIndex(
            "envoye",
            "envoye",
            {
              unique: false
            }
          );

        }

      };


    request.onsuccess =
      function(event) {

        resolve(
          event.target.result
        );

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

  return dbPromise;
}


/********************************************************
 * AJOUT / MODIFICATION
 ********************************************************/

async function enregistrerLocalement(pointage) {

  const db =
    await ouvrirDB();

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.put(pointage);


    request.onsuccess =
      function() {
        resolve();
      };


    request.onerror =
      function() {
        reject(request.error);
      };

  });
}


/********************************************************
 * RÉCUPÉRATION D'UN POINTAGE
 ********************************************************/

async function recupererPointage(id) {

  const db =
    await ouvrirDB();

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.get(id);


    request.onsuccess =
      function() {
        resolve(request.result);
      };


    request.onerror =
      function() {
        reject(request.error);
      };

  });
}


/********************************************************
 * TOUS LES POINTAGES
 ********************************************************/

async function recupererTousLesPointages() {

  const db =
    await ouvrirDB();

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.getAll();


    request.onsuccess =
      function() {

        const result =
          request.result || [];


        result.sort(
          function(a, b) {

            return (
              a.dateHeureMs -
              b.dateHeureMs
            );

          }
        );


        resolve(result);

      };


    request.onerror =
      function() {
        reject(request.error);
      };

  });
}


/********************************************************
 * POINTAGES EN ATTENTE
 ********************************************************/

async function recupererPointagesEnAttente() {

  const tous =
    await recupererTousLesPointages();

  return tous.filter(
    function(pointage) {

      return !pointage.envoye;

    }
  );
}


/********************************************************
 * MIGRATION DE L'ANCIEN LOCALSTORAGE
 ********************************************************/

async function migrerAncienStockage() {

  try {

    const ancien =
      localStorage.getItem(
        OLD_STORAGE_KEY
      );


    if (!ancien) {
      return;
    }


    const pointages =
      JSON.parse(ancien);


    if (!Array.isArray(pointages)) {
      return;
    }


    for (
      const pointage of pointages
    ) {

      if (
        pointage &&
        pointage.id
      ) {

        await enregistrerLocalement(
          pointage
        );

      }

    }


    localStorage.removeItem(
      OLD_STORAGE_KEY
    );


  } catch (error) {

    console.log(
      "Migration localStorage :",
      error
    );

  }
}


/********************************************************
 * ID UNIQUE
 ********************************************************/

function creerId() {

  return (
    "POINTAGE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );

}


/********************************************************
 * CONNEXION
 ********************************************************/

function mettreAJourConnexion() {

  if (navigator.onLine) {

    statusElement.textContent =
      "🟢 CONNECTÉ — synchronisation automatique";

    statusElement.className =
      "status online";


    synchroniser();

  } else {

    statusElement.textContent =
      "🟠 HORS CONNEXION — les pointages sont conservés";

    statusElement.className =
      "status offline";

  }

}


window.addEventListener(
  "online",
  function() {

    mettreAJourConnexion();

    synchroniser();

  }
);


window.addEventListener(
  "offline",
  function() {

    mettreAJourConnexion();

  }
);


/*
 * Sur iPhone, lorsque l'application
 * revient au premier plan.
 */
document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState === "visible"
    ) {

      mettreAJourConnexion();

      synchroniser();

    }

  }
);


/********************************************************
 * GPS
 ********************************************************/

let dernierePosition = null;


function obtenirGPS() {

  return new Promise(
    function(resolve) {

      if (!navigator.geolocation) {

        gpsElement.innerHTML =
          "⚠️ GPS non disponible.<br>" +
          "Le pointage sera quand même enregistré.";

        resolve(null);

        return;
      }


      gpsElement.innerHTML =
        "📍 Recherche de la position...";


      navigator.geolocation.getCurrentPosition(

        function(position) {

          dernierePosition = {

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            precision:
              position.coords.accuracy

          };


          gpsElement.innerHTML =
            "Latitude : " +
            position.coords.latitude.toFixed(6) +
            "<br>" +
            "Longitude : " +
            position.coords.longitude.toFixed(6) +
            "<br>" +
            "Précision : environ " +
            Math.round(
              position.coords.accuracy
            ) +
            " m";


          resolve(
            dernierePosition
          );

        },


        function(error) {

          console.log(
            "GPS :",
            error
          );


          gpsElement.innerHTML =
            "⚠️ Position GPS indisponible.<br>" +
            "Le pointage sera quand même enregistré.";


          resolve(null);

        },


        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 300000

        }

      );

    }
  );

}


/********************************************************
 * POINTAGE
 ********************************************************/

async function fairePointage(type) {


  const nom =
    nomInput.value.trim();


  const prenom =
    prenomInput.value.trim();


  const site =
    siteInput.value.trim();


  if (!nom) {

    alert(
      "Veuillez saisir votre NOM."
    );

    nomInput.focus();

    return;
  }


  if (!prenom) {

    alert(
      "Veuillez saisir votre PRÉNOM."
    );

    prenomInput.focus();

    return;
  }


  if (!site) {

    alert(
      "Veuillez saisir le SITE D'INTERVENTION."
    );

    siteInput.focus();

    return;
  }


  btnStart.disabled = true;

  btnEnd.disabled = true;


  try {


    /*
     * IMPORTANT :
     * on prend l'heure immédiatement.
     */
    const dateHeureMs =
      Date.now();


    /*
     * GPS
     */
    const gps =
      await obtenirGPS();


    /*
     * Création du pointage
     */
    const pointage = {

      id:
        creerId(),

      dateHeureMs:
        dateHeureMs,

      nom:
        nom,

      prenom:
        prenom,

      site:
        site,

      type:
        type,

      latitude:
        gps
          ? gps.latitude
          : "",

      longitude:
        gps
          ? gps.longitude
          : "",

      precision:
        gps
          ? gps.precision
          : "",

      commune:
        "",

      envoye:
        false

    };


    /*
     * SAUVEGARDE LOCALE IMMÉDIATE
     *
     * Même sans Internet,
     * le pointage est maintenant sécurisé.
     */
    await enregistrerLocalement(
      pointage
    );


    afficherHistorique();


    /*
     * Tentative d'envoi immédiat
     */
    if (navigator.onLine) {

      await envoyerPointage(
        pointage
      );

    }


    /*
     * Actualisation de l'affichage
     */
    await afficherHistorique();


    if (pointage.envoye) {

      alert(
        "✅ Pointage enregistré\n\n" +
        type +
        "\n" +
        "Date : " +
        new Date(
          pointage.dateHeureMs
        ).toLocaleString("fr-FR") +
        "\n\n" +
        "✓ Envoyé à Google Sheets."
      );

    } else {

      alert(
        "✅ Pointage enregistré\n\n" +
        type +
        "\n" +
        "Date : " +
        new Date(
          pointage.dateHeureMs
        ).toLocaleString("fr-FR") +
        "\n\n" +
        "🟠 Conservé sur le téléphone.\n" +
        "Il sera envoyé dès que la connexion sera disponible."
      );

    }


  } catch (error) {

    console.error(
      "Erreur pointage :",
      error
    );


    /*
     * Même en cas d'erreur,
     * le pointage reste normalement
     * enregistré dans IndexedDB.
     */
    alert(
      "✅ Le pointage a été conservé sur le téléphone.\n\n" +
      "Il sera synchronisé lorsque la connexion sera disponible."
    );


  } finally {

    btnStart.disabled = false;

    btnEnd.disabled = false;

  }

}


/********************************************************
 * ENVOI GOOGLE SHEETS
 ********************************************************/

async function envoyerPointage(pointage) {

  if (!navigator.onLine) {

    return false;

  }


  try {

    /*
     * IMPORTANT :
     *
     * Apps Script est sur un autre domaine.
     *
     * no-cors permet l'envoi depuis
     * l'application hébergée sur GitHub.
     *
     * La réponse du serveur n'est pas lisible
     * dans le navigateur.
     *
     * L'ID unique côté serveur empêche
     * les doublons en cas de nouvel envoi.
     */

    await fetch(
      URL_GOOGLE_SHEETS,
      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(pointage)

      }
    );


    /*
     * Le serveur a reçu la requête réseau.
     *
     * L'ID unique permet à Apps Script
     * d'éviter un doublon si le même
     * pointage est renvoyé.
     */
    pointage.envoye = true;


    await enregistrerLocalement(
      pointage
    );


    return true;


  } catch (error) {

    console.error(
      "Erreur d'envoi :",
      error
    );


    pointage.envoye = false;


    await enregistrerLocalement(
      pointage
    );


    return false;

  }

}


/********************************************************
 * SYNCHRONISATION
 ********************************************************/

let synchronisationEnCours = false;


async function synchroniser() {


  if (
    !navigator.onLine
  ) {

    return;

  }


  if (
    synchronisationEnCours
  ) {

    return;

  }


  synchronisationEnCours = true;


  try {


    const aEnvoyer =
      await recupererPointagesEnAttente();


    if (!aEnvoyer.length) {

      synchronisationEnCours = false;

      await afficherHistorique();

      return;

    }


    statusElement.textContent =
      "🔄 Synchronisation de " +
      aEnvoyer.length +
      " pointage(s)...";


    statusElement.className =
      "status sync";


    for (
      const pointage of aEnvoyer
    ) {

      if (!navigator.onLine) {
        break;
      }


      const succes =
        await envoyerPointage(
          pointage
        );


      if (!succes) {

        /*
         * On arrête.
         *
         * Le pointage reste en attente
         * et sera réessayé plus tard.
         */
        break;

      }

    }


  } catch (error) {

    console.error(
      "Synchronisation :",
      error
    );

  } finally {

    synchronisationEnCours = false;


    mettreAJourConnexion();

    await afficherHistorique();

  }

}


/********************************************************
 * HISTORIQUE
 ********************************************************/

async function afficherHistorique() {


  const pointages =
    await recupererTousLesPointages();


  if (!pointages.length) {

    historiqueElement.innerHTML =
      "Aucun pointage enregistré.";

    counterElement.textContent =
      "";

    return;

  }


  /*
   * Plus récents d'abord
   */
  const derniers =
    pointages
      .slice()
      .sort(
        function(a, b) {

          return (
            b.dateHeureMs -
            a.dateHeureMs
          );

        }
      )
      .slice(0, 10);


  historiqueElement.innerHTML =
    derniers
      .map(
        function(pointage) {


          const date =
            new Date(
              pointage.dateHeureMs
            ).toLocaleString(
              "fr-FR"
            );


          const debut =
            pointage.type
              .toLowerCase()
              .includes("début");


          return `

            <div class="pointage">

              <div class="badge ${
                debut
                  ? "start"
                  : "end"
              }">

                ${
                  debut
                    ? "🟢 DÉBUT"
                    : "🔴 FIN"
                }

              </div>

              <br>

              <strong>
                ${escapeHtml(pointage.nom)}
                ${escapeHtml(pointage.prenom)}
              </strong>

              <br>

              ${escapeHtml(pointage.site)}

              <br>

              <span class="small">
                ${date}
              </span>

              <br>

              <span class="${
                pointage.envoye
                  ? "success"
                  : "warning"
              }">

                ${
                  pointage.envoye
                    ? "✓ Envoyé"
                    : "⏳ En attente de synchronisation"
                }

              </span>

            </div>

          `;

        }
      )
      .join("");


  const attente =
    pointages.filter(
      function(pointage) {
        return !pointage.envoye;
      }
    ).length;


  if (attente > 0) {

    counterElement.textContent =
      "🟠 " +
      attente +
      " pointage(s) en attente";

  } else {

    counterElement.textContent =
      "🟢 Tous les pointages sont synchronisés";

  }

}


/********************************************************
 * PROTECTION AFFICHAGE
 ********************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/********************************************************
 * DÉMARRAGE
 ********************************************************/

window.addEventListener(
  "load",
  async function() {


    try {

      /*
       * Ouvre IndexedDB
       */
      await ouvrirDB();


      /*
       * Récupère les éventuels
       * anciens pointages.
       */
      await migrerAncienStockage();


      /*
       * Affichage
       */
      await afficherHistorique();


      /*
       * Connexion
       */
      mettreAJourConnexion();


      /*
       * GPS
       */
      obtenirGPS();


      /*
       * Synchronisation
       */
      synchroniser();


    } catch (error) {

      console.error(
        "Démarrage :",
        error
      );


      alert(
        "Erreur de démarrage de l'application."
      );

    }

  }
);


/********************************************************
 * SERVICE WORKER
 ********************************************************/

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .then(
          function() {

            console.log(
              "Service Worker installé."
            );

          }
        )
        .catch(
          function(error) {

            console.log(
              "Service Worker :",
              error
            );

          }
        );

    }
  );

}

</script>

</body>

</html>
