<script>

/* =====================================================
   SERVEUR GOOGLE
===================================================== */

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";


/* =====================================================
   GPS
===================================================== */

let gps = {

  latitude: "",
  longitude: "",
  precision: ""

};


/* =====================================================
   AFFICHAGE GPS
===================================================== */

function afficherGPS(texte) {

  const element =
    document.getElementById("gps");

  if (element) {

    element.textContent = texte;

  }

}


/* =====================================================
   SAUVEGARDE GPS
===================================================== */

function sauvegarderGPS() {

  try {

    localStorage.setItem(
      "dernierGPS",
      JSON.stringify(gps)
    );

  } catch (erreur) {

    console.log(
      "LocalStorage GPS indisponible"
    );

  }

}


/* =====================================================
   CHARGEMENT GPS
===================================================== */

function chargerDernierGPS() {

  try {

    const ancienGPS =
      localStorage.getItem("dernierGPS");

    if (!ancienGPS) {

      return false;

    }


    const position =
      JSON.parse(ancienGPS);


    if (
      position &&
      position.latitude !== "" &&
      position.longitude !== ""
    ) {

      gps = position;

      return true;

    }

  } catch (erreur) {

    console.log(
      "Erreur chargement GPS",
      erreur
    );

  }

  return false;

}


/* =====================================================
   OBTENIR GPS
===================================================== */

function obtenirGPS() {

  return new Promise(function(resolve) {


    /*
       Vérification navigateur
    */

    if (
      !navigator.geolocation
    ) {

      if (chargerDernierGPS()) {

        afficherGPS(
          "📍 Dernière position GPS conservée"
        );

        resolve(true);

      } else {

        afficherGPS(
          "❌ GPS non disponible sur cet appareil"
        );

        resolve(false);

      }

      return;

    }


    /*
       Demande de position
    */

    navigator.geolocation.getCurrentPosition(

      function(position) {


        gps.latitude =
          position.coords.latitude;


        gps.longitude =
          position.coords.longitude;


        gps.precision =
          position.coords.accuracy;


        sauvegarderGPS();


        afficherGPS(
          "✅ Position GPS enregistrée"
        );


        resolve(true);

      },


      function(erreur) {


        console.log(
          "GPS erreur :",
          erreur
        );


        /*
           Si une ancienne position existe,
           on peut continuer.
        */

        if (chargerDernierGPS()) {

          afficherGPS(
            "📍 Dernière position GPS conservée"
          );

          resolve(true);

        } else {

          afficherGPS(
            "❌ Autorisez la localisation pour continuer"
          );

          resolve(false);

        }

      },


      {

        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 300000

      }

    );

  });

}


/* =====================================================
   POINTAGES LOCAUX
===================================================== */

function chargerPointages() {

  try {

    return JSON.parse(
      localStorage.getItem("pointages") || "[]"
    );

  } catch (erreur) {

    return [];

  }

}


function sauvegarderPointages(pointages) {

  try {

    localStorage.setItem(
      "pointages",
      JSON.stringify(pointages)
    );

  } catch (erreur) {

    console.log(
      "Erreur sauvegarde pointage",
      erreur
    );

  }

}


/* =====================================================
   AFFICHER ATTENTE
===================================================== */

function afficherAttente() {

  const total =
    chargerPointages().length;


  const element =
    document.getElementById("attente");


  if (!element) {

    return;

  }


  if (total > 0) {

    element.textContent =
      total +
      " pointage(s) en attente d'envoi.";

  } else {

    element.textContent =
      "";

  }

}


/* =====================================================
   ENVOI GOOGLE
===================================================== */

async function envoyerPointage(pointage) {

  /*
     no-cors est conservé pour Google Apps Script.

     Le navigateur peut recevoir une réponse opaque,
     ce qui est normal avec no-cors.
  */

  await fetch(

    SERVEUR,

    {

      method: "POST",

      mode: "no-cors",

      headers: {

        "Content-Type":
          "text/plain;charset=utf-8"

      },

      body:
        JSON.stringify(pointage)

    }

  );

}


/* =====================================================
   SYNCHRONISATION
===================================================== */

let synchronisationEnCours =
  false;


async function synchroniser() {


  if (
    synchronisationEnCours
  ) {

    return;

  }


  if (
    !navigator.onLine
  ) {

    afficherAttente();

    return;

  }


  synchronisationEnCours =
    true;


  try {


    const pointages =
      chargerPointages();


    if (
      pointages.length === 0
    ) {

      afficherAttente();

      return;

    }


    const restants = [];


    for (
      const pointage of pointages
    ) {


      try {

        await envoyerPointage(
          pointage
        );

      } catch (erreur) {

        console.log(
          "Envoi impossible",
          erreur
        );

        restants.push(
          pointage
        );

      }

    }


    sauvegarderPointages(
      restants
    );


    afficherAttente();


  } finally {

    synchronisationEnCours =
      false;

  }

}


/* =====================================================
   BOUTONS POINTAGE
===================================================== */

document
.querySelectorAll(".type-button")
.forEach(function(button) {


  button.addEventListener(
    "click",
    async function(event) {


      event.preventDefault();


      if (
        button.disabled
      ) {

        return;

      }


      const nom =
        document
        .getElementById("nom")
        .value
        .trim();


      const prenom =
        document
        .getElementById("prenom")
        .value
        .trim();


      const site =
        document
        .getElementById("site")
        .value
        .trim();


      const type =
        button.dataset.type;


      const message =
        document.getElementById(
          "message"
        );


      /*
         Vérification
      */

      if (
        !nom ||
        !prenom ||
        !site
      ) {

        message.textContent =
          "❌ Remplissez le nom, prénom et site.";

        message.style.color =
          "red";

        return;

      }


      /*
         Désactivation
         immédiate
      */

      button.disabled =
        true;


      message.textContent =
        "📍 Vérification de la position GPS...";


      message.style.color =
        "#111";


      /*
         GPS
      */

      const gpsOK =
        await obtenirGPS();


      if (!gpsOK) {

        message.textContent =
          "❌ Autorisez la localisation puis réessayez.";

        message.style.color =
          "red";

        button.disabled =
          false;

        return;

      }


      /*
         Création pointage
      */

      const maintenant =
        Date.now();


      const pointage = {

        id:
          maintenant.toString() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 10),

        dateHeure:
          maintenant,

        nom:
          nom,

        prenom:
          prenom,

        type:
          type,

        site:
          site,

        latitude:
          gps.latitude,

        longitude:
          gps.longitude,

        precision:
          gps.precision

      };


      /*
         Sauvegarde immédiate
         sur le téléphone
      */

      let pointages =
        chargerPointages();


      pointages.push(
        pointage
      );


      sauvegarderPointages(
        pointages
      );


      /*
         Message
      */

      message.textContent =
        "📤 Enregistrement...";


      message.style.color =
        "#111";


      /*
         Tentative d'envoi
      */

      if (
        navigator.onLine
      ) {

        try {

          await synchroniser();

          message.textContent =
            "✅ POINTAGE ENREGISTRÉ";

          message.style.color =
            "green";

        } catch (erreur) {

          console.log(
            erreur
          );

          message.textContent =
            "📵 POINTAGE SAUVEGARDÉ";

          message.style.color =
            "green";

        }

      } else {

        message.textContent =
          "📵 HORS CONNEXION : POINTAGE SAUVEGARDÉ";

        message.style.color =
          "green";

      }


      /*
         Animation bouton
      */

      button.classList.add(
        "selected"
      );


      afficherAttente();


      /*
         Effacement champs
      */

      document
        .getElementById("nom")
        .value = "";


      document
        .getElementById("prenom")
        .value = "";


      document
        .getElementById("site")
        .value = "";


      /*
         Retour bouton normal
      */

      setTimeout(
        function() {

          button.classList.remove(
            "selected"
          );

          button.disabled =
            false;

        },
        1500
      );


    },
    {
      passive: false
    }
  );

});


/* =====================================================
   RETOUR INTERNET
===================================================== */

window.addEventListener(
  "online",
  function() {

    synchroniser();

  }
);


/* =====================================================
   INITIALISATION
===================================================== */

(function initialiser() {


  /*
     Si GPS précédent disponible
    */

  if (
    chargerDernierGPS()
  ) {

    afficherGPS(
      "📍 Position GPS enregistrée"
    );

  }


  /*
     Demande GPS
  */

  obtenirGPS();


  /*
     Affichage attente
  */

  afficherAttente();


  /*
     Synchronisation
  */

  synchroniser();


})();


/* =====================================================
   SERVICE WORKER
===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .then(function() {

          console.log(
            "Service Worker actif"
          );

        })
        .catch(function(erreur) {

          console.log(
            "Service Worker non disponible :",
            erreur
          );

        });

    }
  );

}

</script>


</body>
