/* GPS */

function lancerGPS(){

  const bloc =
    document.getElementById("gps");


  if (!navigator.geolocation){

    bloc.className = "erreur";

    bloc.innerHTML =
      "⚠️ GPS non disponible.<br>" +
      "<small>" +
      "Vous pouvez quand même effectuer le pointage." +
      "</small>";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position){

      positionGPS = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        precision:
          position.coords.accuracy

      };


      bloc.className = "ok";

      bloc.innerHTML =
        "✅ Position GPS enregistrée";


      await rechercherCommune();

    },


    function(error){

      bloc.className = "erreur";


      if(error.code === 1){

        bloc.innerHTML =
          "⚠️ Localisation non autorisée.<br>" +
          "<small>" +
          "Le pointage reste possible sans GPS." +
          "</small>";

      }else{

        bloc.innerHTML =
          "⚠️ Position GPS indisponible.<br>" +
          "<small>" +
          "Le pointage reste possible sans GPS." +
          "</small>";

      }

    },

    {

      enableHighAccuracy:true,

      timeout:30000,

      maximumAge:0

    }

  );

}


/* RECHERCHE DE LA COMMUNE */

async function rechercherCommune(){

  if(!positionGPS){

    return;

  }


  if(!navigator.onLine){

    communeGPS = null;

    return;

  }


  try{

    const latitude =
      positionGPS.latitude;

    const longitude =
      positionGPS.longitude;


    const url =
      "https://data.geopf.fr/geocodage/reverse?" +
      "lon=" +
      encodeURIComponent(longitude) +
      "&lat=" +
      encodeURIComponent(latitude);


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "Erreur géocodage"
      );

    }


    const data =
      await response.json();


    if(
      data &&
      data.features &&
      data.features.length
    ){

      const propriete =
        data.features[0].properties;


      communeGPS =
        propriete.city ||
        propriete.municipality ||
        propriete.label ||
        null;


      if(communeGPS){

        document.getElementById(
          "gps"
        ).innerHTML =
          "✅ Position GPS enregistrée<br>" +
          "<small>" +
          "Commune : " +
          communeGPS +
          "</small>";

      }

    }

  }catch(error){

    console.log(
      "Commune impossible à déterminer :",
      error
    );

    communeGPS = null;

  }

}


/* CREATION D'UN IDENTIFIANT UNIQUE */

function creerPointageId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ){

    return window.crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).substring(2) +
    "-" +
    Math.random().toString(36).substring(2)
  );

}

function activerFormulaire(){

  [

    "prenom",
    "site",
    "type"
  ]
  .forEach(function(id){

    const element =
      document.getElementById(id);


    element.addEventListener(
      "input",
      verifier
    );


    element.addEventListener(
      "change",
      verifier
    );

  });

}

        "Stockage impossible :",
        error
      );

      document.getElementById(
        "message"
      ).innerHTML =
        "⚠️ Impossible d'enregistrer le pointage.";

    });

}


/* INDEXEDDB */

function ouvrirDB(){

  return new Promise(
    function(resolve,reject){

      const request =
        indexedDB.open(
          "POINTAGE_DB",
          1
        );


      request.onupgradeneeded =
        function(event){

          const db =
            event.target.result;


          if(
            !db.objectStoreNames.contains(
              "pointages"
            )
          ){

            db.createObjectStore(
              "pointages",
              {
                keyPath:"id",
                autoIncrement:true
              }
            );

          }

        };


      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };


      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


/* STOCKER */

          resolve(
            request.result
          );

        };

        function(){

          reject(
            request.error
          );

        };

    }
  );

}
