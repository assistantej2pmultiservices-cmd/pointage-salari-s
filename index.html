```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pointage salarié</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ccc;
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 6px;
  font-size: 16px;
}

button {
  margin-top: 25px;
  background: #1a73e8;
  color: white;
  border: 0;
  border-radius: 6px;
}

button:disabled {
  background: #999;
}

#gps, #message {
  margin-top: 15px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>Pointage salarié</h1>

<form id="formPointage">

<label>Nom</label>
<input id="nom" required>

<label>Prénom</label>
<input id="prenom" required>

<label>Site</label>
<input id="site" required>

<label>Type de pointage</label>
<select id="type" required>
  <option value="">Sélectionner</option>
  <option value="Arrivée">Arrivée</option>
  <option value="Départ">Départ</option>
  <option value="Pause début">Pause début</option>
  <option value="Pause fin">Pause fin</option>
</select>

<div id="gps">Recherche GPS...</div>

<button id="bouton" type="submit">
ENREGISTRER LE POINTAGE
</button>

<div id="message"></div>

</form>

</div>

<script>

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";

let positionGPS = {
  latitude: "",
  longitude: "",
  precision: ""
};

function obtenirGPS() {

  if (!navigator.geolocation) {
    document.getElementById("gps").textContent =
      "GPS non disponible";
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      positionGPS.latitude =
        position.coords.latitude;

      positionGPS.longitude =
        position.coords.longitude;

      positionGPS.precision =
        position.coords.accuracy;

      document.getElementById("gps").textContent =
        "GPS OK";
    },

    function() {

      document.getElementById("gps").textContent =
        "GPS non disponible";
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

document.getElementById("formPointage")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const bouton =
    document.getElementById("bouton");

  const message =
    document.getElementById("message");

  bouton.disabled = true;
  message.textContent = "Enregistrement...";

  const pointage = {

    dateHeure: new Date().toISOString(),

    nom:
      document.getElementById("nom").value.trim(),

    prenom:
      document.getElementById("prenom").value.trim(),

    site:
      document.getElementById("site").value.trim(),

    type:
      document.getElementById("type").value,

    latitude:
      positionGPS.latitude,

    longitude:
      positionGPS.longitude,

    precision:
      positionGPS.precision
  };

  try {

    await fetch(SERVEUR, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(pointage)
    });

    message.textContent =
      "Pointage enregistré ✔";

    message.style.color = "green";

    document.getElementById("formPointage").reset();

    obtenirGPS();

  } catch (error) {

    message.textContent =
      "Erreur d'enregistrement";

    message.style.color = "red";

  } finally {

    bouton.disabled = false;
  }
});

obtenirGPS();

</script>

</body>
</html>
```
