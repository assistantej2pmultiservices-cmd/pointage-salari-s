<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>POINTAGE</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .debut {
      background: #16a34a;
    }

    .fin {
      background: #dc2626;
    }

    #gps,
    #message {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>POINTAGE</h1>

  <input
    id="nom"
    type="text"
    placeholder="NOM"
  >

  <input
    id="prenom"
    type="text"
    placeholder="PRÉNOM"
  >

  <input
    id="site"
    type="text"
    placeholder="SITE D'INTERVENTION"
  >

  <div id="gps">
    📍 Recherche GPS...
  </div>

  <button
    class="debut"
    onclick="envoyerPointage(
      'Heure de début de prestation',
      this
    )"
  >
    🟢 HEURE DE DÉBUT DE PRESTATION
  </button>

  <button
    class="fin"
    onclick="envoyerPointage(
      'Heure de fin de prestation',
      this
    )"
  >
    🔴 HEURE DE FIN DE PRESTATION
  </button>

  <div id="message"></div>

</div>


<script>

/*
========================================================
METTRE ICI LA NOUVELLE URL /exec
========================================================
*/

const URL_GOOGLE_SHEETS =
  "COLLE_TA_NOUVELLE_URL_ICI";


let gps = {
  latitude: "",
  longitude: "",
  precision: ""
};


/*
========================================================
GPS
========================================================
*/

function recupererGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gps").textContent =
      "GPS non disponible";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      gps.latitude =
        position.coords.latitude;

      gps.longitude =
        position.coords.longitude;

      gps.precision =
        position.coords.accuracy;

      document.getElementById("gps").innerHTML =
        "📍 GPS OK<br>" +
        "Latitude : " +
        gps.latitude.toFixed(6) +
        "<br>" +
        "Longitude : " +
        gps.longitude.toFixed(6);

    },

    function() {

      document.getElementById("gps").textContent =
        "⚠️ GPS indisponible";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 300000
    }

  );
}


/*
========================================================
ENVOI DU POINTAGE
========================================================
*/

function envoyerPointage(type, bouton) {

  const nom =
    document.getElementById("nom").value.trim();

  const prenom =
    document.getElementById("prenom").value.trim();

  const site =
    document.getElementById("site").value.trim();


  if (!nom || !prenom || !site) {

    alert(
      "Merci de remplir NOM, PRÉNOM et SITE."
    );

    return;
  }


  bouton.disabled = true;

  document.getElementById("message").textContent =
    "⏳ Envoi du pointage...";


  const donnees = {

    id:
      "POINTAGE-" +
      Date.now(),

    dateHeureMs:
      Date.now(),

    nom:
      nom,

    prenom:
      prenom,

    site:
      site,

    type:
      type,

    latitude:
      gps.latitude,

    longitude:
      gps.longitude,

    precision:
      gps.precision

  };


  fetch(

    URL_GOOGLE_SHEETS,

    {
      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(donnees)
    }

  )

  .then(function() {

    document.getElementById("message").textContent =
      "✅ POINTAGE ENVOYÉ";

    bouton.disabled = false;

  })

  .catch(function(error) {

    console.error(error);

    document.getElementById("message").textContent =
      "❌ ERREUR D'ENVOI";

    bouton.disabled = false;

  });

}


/*
========================================================
DÉMARRAGE
========================================================
*/

recupererGPS();

</script>

</body>

</html>
