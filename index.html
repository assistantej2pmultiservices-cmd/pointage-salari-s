<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0f766e"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="Pointage"
>

<title>Pointage</title>


<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  min-height: 100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f1f5f9;
}


body {

  padding:
    env(safe-area-inset-top)
    12px
    env(safe-area-inset-bottom)
    12px;
}


.container {

  width: 100%;
  max-width: 600px;

  margin: auto;
}


.header {

  background: #0f766e;
  color: white;

  padding: 22px 18px;

  border-radius: 18px;

  margin: 12px 0;

  text-align: center;
}


.header h1 {

  margin: 0;

  font-size: 30px;
}


.header p {

  margin: 8px 0 0;

  opacity: .9;
}


.card {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 14px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.08);
}


label {

  display: block;

  font-weight: bold;

  margin-bottom: 7px;
}


input {

  width: 100%;

  min-height: 52px;

  padding: 12px;

  border:
    1px solid #cbd5e1;

  border-radius: 12px;

  font-size: 18px;

  margin-bottom: 15px;
}


button {

  width: 100%;

  min-height: 68px;

  border: none;

  border-radius: 16px;

  color: white;

  font-size: 17px;

  font-weight: bold;

  margin-top: 10px;

  cursor: pointer;

  touch-action: manipulation;
}


button:disabled {

  opacity: .55;
}


.btn-start {

  background: #16a34a;
}


.btn-end {

  background: #dc2626;
}


.status {

  text-align: center;

  padding: 14px;

  border-radius: 12px;

  font-weight: bold;

  margin-bottom: 14px;
}


.online {

  background: #dcfce7;

  color: #166534;
}


.offline {

  background: #fef3c7;

  color: #92400e;
}


.gps {

  color: #475569;

  font-size: 14px;

  line-height: 1.7;
}


.history-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 12px;
}


.pointage {

  padding: 13px 0;

  border-bottom:
    1px solid #e2e8f0;
}


.pointage:last-child {

  border-bottom: none;
}


.badge {

  display: inline-block;

  padding: 5px 9px;

  border-radius: 8px;

  font-weight: bold;

  font-size: 13px;
}


.badge-start {

  background: #dcfce7;

  color: #166534;
}


.badge-finished {

  background: #dbeafe;

  color: #1e40af;
}


.badge-pending {

  background: #fef3c7;

  color: #92400e;
}


.small {

  color: #64748b;

  font-size: 13px;

  line-height: 1.7;
}

</style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>POINTAGE</h1>

    <p>
      Enregistrement des prestations
    </p>

  </div>


  <div
    id="status"
    class="status"
  >
    Connexion...
  </div>


  <!-- =========================
       FORMULAIRE
       ========================= -->

  <div class="card">


    <label for="nom">
      NOM
    </label>


    <input
      id="nom"
      type="text"
      autocomplete="family-name"
      placeholder="Votre nom"
    >


    <label for="prenom">
      PRÉNOM
    </label>


    <input
      id="prenom"
      type="text"
      autocomplete="given-name"
      placeholder="Votre prénom"
    >


    <label for="site">
      SITE D'INTERVENTION
    </label>


    <input
      id="site"
      type="text"
      autocomplete="organization"
      placeholder="Site d'intervention"
    >


  </div>


  <!-- =========================
       BOUTONS
       ========================= -->

  <div class="card">


    <button
      id="btnDebut"
      class="btn-start"
      onclick="fairePointage('Heure de début de prestation')"
    >

      🟢 HEURE DE DÉBUT DE PRESTATION

    </button>


    <button
      id="btnFin"
      class="btn-end"
      onclick="fairePointage('Heure de fin de prestation')"
    >

      🔴 HEURE DE FIN DE PRESTATION

    </button>


  </div>


  <!-- =========================
       GPS
       ========================= -->

  <div class="card">


    <div class="history-title">
      📍 Position GPS
    </div>


    <div
      id="gps"
      class="gps"
    >
      Recherche de la position...
    </div>


  </div>


  <!-- =========================
       HISTORIQUE
       ========================= -->

  <div class="card">


    <div class="history-title">
      📋 Derniers pointages
    </div>


    <div id="historique">
      Aucun pointage.
    </div>


  </div>


</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const URL_GOOGLE_SHEETS =
"https://script.google.com/macros/s/AKfycbz4HpbPBEMQBk3ApqjRVQmRAXqQmamlAj2eQEolYRyhpl41Ccy-Q-kr-5H7vinhC9j1kA/exec";


const STORAGE_KEY =
"pointages";


/* =====================================================
   ÉLÉMENTS
   ===================================================== */

const nomInput =
document.getElementById("nom");

const prenomInput =
document.getElementById("prenom");

const siteInput =
document.getElementById("site");

const statusElement =
document.getElementById("status");

const gpsElement =
document.getElementById("gps");

const historiqueElement =
document.getElementById("historique");

const btnDebut =
document.getElementById("btnDebut");

const btnFin =
document.getElementById("btnFin");


/* =====================================================
   STOCKAGE LOCAL
   ===================================================== */

function getPointages() {

  try {

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

  } catch (e) {

    return [];

  }

}


function savePointages(pointages) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(pointages)
  );

}


/* =====================================================
   ID
   ===================================================== */

function creerId() {

  return (

    "POINTAGE-" +

    Date.now() +

    "-" +

    Math.random()
      .toString(36)
      .substring(2, 10)

  );

}


/* =====================================================
   CONNEXION
   ===================================================== */

function actualiserConnexion() {

  if (navigator.onLine) {

    statusElement.textContent =
      "🟢 CONNECTÉ — enregistrement automatique";

    statusElement.className =
      "status online";

    synchroniser();

  } else {

    statusElement.textContent =
      "🟠 HORS CONNEXION — enregistrement automatique";

    statusElement.className =
      "status offline";

  }

}


window.addEventListener(
  "online",
  actualiserConnexion
);


window.addEventListener(
  "offline",
  actualiserConnexion
);


document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      synchroniser();

    }

  }
);


/* =====================================================
   GPS
   ===================================================== */

function obtenirGPS() {

  return new Promise(
    function(resolve) {

      if (
        !navigator.geolocation
      ) {

        gpsElement.innerHTML =
          "⚠️ GPS non disponible.";

        resolve(null);

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const gps = {

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            precision:
              position.coords.accuracy

          };


          gpsElement.innerHTML =

            "Latitude : " +

            gps.latitude.toFixed(6) +

            "<br>" +

            "Longitude : " +

            gps.longitude.toFixed(6) +

            "<br>" +

            "Précision : environ " +

            Math.round(
              gps.precision
            ) +

            " m";


          resolve(gps);

        },


        function() {

          gpsElement.innerHTML =
            "⚠️ GPS indisponible. " +
            "Le pointage sera quand même enregistré.";

          resolve(null);

        },


        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 300000

        }

      );

    }
  );

}


/* =====================================================
   POINTAGE
   ===================================================== */

async function fairePointage(type) {


  const nom =
    nomInput.value.trim();


  const prenom =
    prenomInput.value.trim();


  const site =
    siteInput.value.trim();


  /*
   * Pas de fenêtre de validation.
   * On affiche simplement l'information
   * dans le formulaire.
   */

  if (!nom) {

    statusElement.textContent =
      "⚠️ Saisissez le NOM";

    return;

  }


  if (!prenom) {

    statusElement.textContent =
      "⚠️ Saisissez le PRÉNOM";

    return;

  }


  if (!site) {

    statusElement.textContent =
      "⚠️ Saisissez le SITE";

    return;

  }


  btnDebut.disabled = true;
  btnFin.disabled = true;


  try {


    const gps =
      await obtenirGPS();


    const maintenant =
      Date.now();


    /* =================================================
       DÉBUT
       ================================================= */

    if (
      type ===
      "Heure de début de prestation"
    ) {


      const pointage = {

        id:
          creerId(),

        dateHeureMs:
          maintenant,

        nom:
          nom,

        prenom:
          prenom,

        site:
          site,

        type:
          type,

        latitude:
          gps
            ? gps.latitude
            : "",

        longitude:
          gps
            ? gps.longitude
            : "",

        precision:
          gps
            ? gps.precision
            : "",

        commune:
          "",

        debutEnvoye:
          false,

        finDateHeureMs:
          null,

        finEnvoyee:
          false

      };


      /*
       * Enregistrement LOCAL immédiat.
       */

      const pointages =
        getPointages();


      pointages.push(
        pointage
      );


      savePointages(
        pointages
      );


      afficherHistorique();


      /*
       * Envoi immédiat si connecté.
       */

      if (
        navigator.onLine
      ) {

        try {

          await envoyerDebut(
            pointage
          );

        } catch (error) {

          console.error(
            error
          );

        }

      }


      statusElement.textContent =
        pointage.debutEnvoye
          ? "✅ DÉBUT ENREGISTRÉ"
          : "✅ DÉBUT ENREGISTRÉ — synchronisation en attente";


    }


    /* =================================================
       FIN
       ================================================= */

    else {


      const pointages =
        getPointages();


      let debut =
        null;


      /*
       * Recherche du dernier début ouvert.
       */

      for (
        let i =
          pointages.length - 1;

        i >= 0;

        i--
      ) {

        const p =
          pointages[i];


        if (

          p.nom === nom &&

          p.prenom === prenom &&

          p.site === site &&

          p.type ===
            "Heure de début de prestation" &&

          !p.finDateHeureMs

        ) {

          debut =
            p;

          break;

        }

      }


      /*
       * Si aucun début local :
       * on ne demande aucune validation.
       */

      if (!debut) {

        statusElement.textContent =
          "⚠️ Aucun début ouvert trouvé pour cette personne et ce site.";

        return;

      }


      /*
       * Enregistrement local immédiat de la FIN.
       */

      debut.finDateHeureMs =
        maintenant;


      debut.finLatitude =
        gps
          ? gps.latitude
          : "";


      debut.finLongitude =
        gps
          ? gps.longitude
          : "";


      debut.finPrecision =
        gps
          ? gps.precision
          : "";


      savePointages(
        pointages
      );


      afficherHistorique();


      /*
       * Envoi immédiat si connecté.
       */

      if (
        navigator.onLine
      ) {

        try {

          await envoyerFin(
            debut
          );

        } catch (error) {

          console.error(
            error
          );

        }

      }


      statusElement.textContent =
        debut.finEnvoyee
          ? "✅ FIN ENREGISTRÉE — même ligne"
          : "✅ FIN ENREGISTRÉE — synchronisation en attente";

    }


  } catch (error) {

    console.error(
      error
    );


    statusElement.textContent =
      "✅ Pointage enregistré sur le téléphone — synchronisation en attente";


  } finally {

    btnDebut.disabled = false;
    btnFin.disabled = false;

  }

}


/* =====================================================
   ENVOI DU DÉBUT
   ===================================================== */

async function envoyerDebut(
  pointage
) {


  const params =
    new URLSearchParams();


  params.set(
    "action",
    "pointage"
  );


  params.set(
    "id",
    pointage.id
  );


  params.set(
    "dateHeureMs",
    pointage.dateHeureMs
  );


  params.set(
    "nom",
    pointage.nom
  );


  params.set(
    "prenom",
    pointage.prenom
  );


  params.set(
    "type",
    "Heure de début de prestation"
  );


  params.set(
    "site",
    pointage.site
  );


  params.set(
    "latitude",
    pointage.latitude || ""
  );


  params.set(
    "longitude",
    pointage.longitude || ""
  );


  params.set(
    "precision",
    pointage.precision || ""
  );


  params.set(
    "commune",
    pointage.commune || ""
  );


  const url =
    URL_GOOGLE_SHEETS +
    "?" +
    params.toString();


  await fetch(
    url,
    {

      method: "GET",

      mode: "no-cors",

      cache: "no-store"

    }
  );


  pointage.debutEnvoye =
    true;


  const pointages =
    getPointages();


  const index =
    pointages.findIndex(
      function(p) {

        return (
          p.id ===
          pointage.id
        );

      }
    );


  if (index !== -1) {

    pointages[index] =
      pointage;

    savePointages(
      pointages
    );

  }


  afficherHistorique();

}


/* =====================================================
   ENVOI DE LA FIN
   ===================================================== */

async function envoyerFin(
  pointage
) {


  const params =
    new URLSearchParams();


  params.set(
    "action",
    "pointage"
  );


  params.set(
    "id",
    pointage.id
  );


  params.set(
    "dateHeureMs",
    pointage.finDateHeureMs
  );


  params.set(
    "nom",
    pointage.nom
  );


  params.set(
    "prenom",
    pointage.prenom
  );


  params.set(
    "type",
    "Heure de fin de prestation"
  );


  params.set(
    "site",
    pointage.site
  );


  params.set(
    "latitude",
    pointage.finLatitude || ""
  );


  params.set(
    "longitude",
    pointage.finLongitude || ""
  );


  params.set(
    "precision",
    pointage.finPrecision || ""
  );


  params.set(
    "commune",
    pointage.commune || ""
  );


  const url =
    URL_GOOGLE_SHEETS +
    "?" +
    params.toString();


  await fetch(
    url,
    {

      method: "GET",

      mode: "no-cors",

      cache: "no-store"

    }
  );


  pointage.finEnvoyee =
    true;


  const pointages =
    getPointages();


  const index =
    pointages.findIndex(
      function(p) {

        return (
          p.id ===
          pointage.id
        );

      }
    );


  if (index !== -1) {

    pointages[index] =
      pointage;

    savePointages(
      pointages
    );

  }


  afficherHistorique();

}


/* =====================================================
   SYNCHRONISATION AUTOMATIQUE
   ===================================================== */

async function synchroniser() {


  if (
    !navigator.onLine
  ) {

    return;

  }


  const pointages =
    getPointages();


  for (
    const pointage
    of pointages
  ) {


    try {


      /*
       * Début non envoyé
       */

      if (

        pointage.type ===
          "Heure de début de prestation" &&

        !pointage.debutEnvoye

      ) {

        await envoyerDebut(
          pointage
        );

      }


      /*
       * Fin non envoyée
       */

      if (

        pointage.finDateHeureMs &&

        !pointage.finEnvoyee

      ) {

        await envoyerFin(
          pointage
        );

      }


    } catch (error) {

      console.log(
        "Synchronisation en attente."
      );

    }

  }


  afficherHistorique();

}


/* =====================================================
   HISTORIQUE
   ===================================================== */

function afficherHistorique() {


  const pointages =
    getPointages();


  if (
    !pointages.length
  ) {

    historiqueElement.innerHTML =
      "Aucun pointage.";

    return;

  }


  const derniers =
    pointages
      .slice(-10)
      .reverse();


  historiqueElement.innerHTML =

    derniers
      .map(
        function(p) {


          const dateDebut =
            new Date(
              p.dateHeureMs
            ).toLocaleString(
              "fr-FR"
            );


          let html = "";


          html +=
            '<div class="pointage">';


          html +=
            '<span class="badge badge-start">' +
            '🟢 DÉBUT' +
            '</span>';


          html +=
            '<br><strong>' +
            escapeHtml(
              p.nom
            ) +
            ' ' +
            escapeHtml(
              p.prenom
            ) +
            '</strong>';


          html +=
            '<br>' +
            escapeHtml(
              p.site
            );


          html +=
            '<br>' +
            '<span class="small">' +
            'Début : ' +
            dateDebut +
            '</span>';


          if (
            p.finDateHeureMs
          ) {


            const dateFin =
              new Date(
                p.finDateHeureMs
              ).toLocaleString(
                "fr-FR"
              );


            html +=
              '<br>' +
              '<span class="small">' +
              'Fin : ' +
              dateFin +
              '</span>';


            if (
              p.finEnvoyee
            ) {

              html +=
                '<br>' +
                '<span class="badge badge-finished">' +
                '✓ DÉBUT + FIN ENREGISTRÉS' +
                '</span>';

            } else {

              html +=
                '<br>' +
                '<span class="badge badge-pending">' +
                '⏳ FIN EN ATTENTE DE SYNCHRONISATION' +
                '</span>';

            }


          } else {


            if (
              p.debutEnvoye
            ) {

              html +=
                '<br>' +
                '<span class="badge badge-start">' +
                '✓ DÉBUT ENREGISTRÉ — EN ATTENTE DE FIN' +
                '</span>';

            } else {

              html +=
                '<br>' +
                '<span class="badge badge-pending">' +
                '⏳ DÉBUT EN ATTENTE DE SYNCHRONISATION' +
                '</span>';

            }

          }


          html +=
            '</div>';


          return html;

        }
      )
      .join("");

}


/* =====================================================
   PROTECTION HTML
   ===================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   DÉMARRAGE
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    actualiserConnexion();

    afficherHistorique();

    obtenirGPS();

    synchroniser();

  }
);


/* =====================================================
   SERVICE WORKER
   ===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(
          function(error) {

            console.log(
              "Service Worker :",
              error
            );

          }
        );

    }
  );

}

</script>

</body>
</html>
