```html
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Pointage</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

h2{
  text-align:center;
}

#gps{
  padding:18px;
  text-align:center;
  border-radius:10px;
  margin-bottom:20px;
  background:#e8f1ff;
  font-weight:bold;
}

.ok{
  background:#e8f5e9!important;
  color:#176b20;
}

.erreur{
  background:#ffebee!important;
  color:#b00020;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

#message{
  text-align:center;
  font-weight:bold;
  margin-top:20px;
}

</style>

</head>

<body>

<div class="box">

<h2>📍 POINTAGE</h2>

<div id="gps">
📍 Recherche de votre position...
</div>

<label>NOM</label>

<input id="nom" type="text">

<label>PRÉNOM</label>

<input id="prenom" type="text">

<label>SITE D'INTERVENTION</label>

<input id="site" type="text">

<label>TYPE DE POINTAGE</label>

<select id="type">

<option value="">
-- Sélectionnez --
</option>

<option value="Heure de début de prestation">
Heure de début de prestation
</option>

<option value="Heure de fin de prestation">
Heure de fin de prestation
</option>

</select>

<div id="message"></div>

</div>

<script>

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";


let positionGPS = null;
let communeGPS = null;
let envoiEnCours = false;


/* GPS */

function lancerGPS(){

  if(!navigator.geolocation){

    document.getElementById("gps").innerHTML =
      "⚠️ GPS non disponible";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    async function(position){

      positionGPS = {

        latitude: position.coords.latitude,

        longitude: position.coords.longitude,

        precision: position.coords.accuracy

      };

      document.getElementById("gps").className = "ok";

      document.getElementById("gps").innerHTML =
        "✅ Position GPS enregistrée";

      await rechercherCommune();

    },

    function(){

      document.getElementById("gps").className =
        "erreur";

      document.getElementById("gps").innerHTML =
        "⚠️ GPS indisponible<br>" +
        "<small>Le pointage reste possible.</small>";

    },

    {
      enableHighAccuracy:true,
      timeout:30000,
      maximumAge:0
    }

  );

}


/* COMMUNE */

async function rechercherCommune(){

  if(!positionGPS || !navigator.onLine){
    return;
  }

  try{

    var url =
      "https://data.geopf.fr/geocodage/reverse?" +
      "lon=" +
      encodeURIComponent(positionGPS.longitude) +
      "&lat=" +
      encodeURIComponent(positionGPS.latitude);

    var response =
      await fetch(url);

    if(!response.ok){
      return;
    }

    var data =
      await response.json();

    if(
      data.features &&
      data.features.length
    ){

      var p =
        data.features[0].properties;

      communeGPS =
        p.city ||
        p.municipality ||
        p.label ||
        null;

      if(communeGPS){

        document.getElementById("gps").innerHTML =
          "✅ Position GPS enregistrée<br>" +
          "<small>Commune : " +
          communeGPS +
          "</small>";

      }

    }

  }catch(error){

    console.log(error);

  }

}


/* VERIFICATION DU FORMULAIRE */

function verifier(){

  if(envoiEnCours){
    return;
  }

  var nom =
    document.getElementById("nom").value.trim();

  var prenom =
    document.getElementById("prenom").value.trim();

  var site =
    document.getElementById("site").value.trim();

  var type =
    document.getElementById("type").value;

  if(
    nom &&
    prenom &&
    site &&
    type
  ){

    envoyer();

  }

}


/* ENVOI */

async function envoyer(){

  if(envoiEnCours){
    return;
  }

  envoiEnCours = true;

  var maintenant = new Date();

  var pointage = {

    dateHeure:
      maintenant.toISOString(),

    date:
      maintenant.toLocaleDateString("fr-FR"),

    heure:
      maintenant.toLocaleTimeString("fr-FR"),

    nom:
      document.getElementById("nom").value.trim(),

    prenom:
      document.getElementById("prenom").value.trim(),

    site:
      document.getElementById("site").value.trim(),

    type:
      document.getElementById("type").value,

    latitude:
      positionGPS
        ? positionGPS.latitude
        : "",

    longitude:
      positionGPS
        ? positionGPS.longitude
        : "",

    precision:
      positionGPS
        ? positionGPS.precision
        : "",

    commune:
      communeGPS ||
      "Commune non déterminée"

  };


  document.getElementById("message").innerHTML =
    "⏳ Envoi du pointage...";


  try{

    await fetch(

      SERVEUR,

      {
        method:"POST",

        mode:"no-cors",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(pointage)
      }

    );


    document.getElementById("message").innerHTML =
      "✅ POINTAGE ENREGISTRÉ";


    document.getElementById("nom").value = "";
    document.getElementById("prenom").value = "";
    document.getElementById("site").value = "";
    document.getElementById("type").value = "";

  }

  catch(error){

    console.log(error);

    document.getElementById("message").innerHTML =
      "⚠️ Erreur d'envoi";

  }

  finally{

    envoiEnCours = false;

  }

}


/* CHAMPS */

document
  .getElementById("nom")
  .addEventListener("input", verifier);

document
  .getElementById("prenom")
  .addEventListener("input", verifier);

document
  .getElementById("site")
  .addEventListener("input", verifier);

document
  .getElementById("type")
  .addEventListener("change", verifier);


/* DEMARRAGE */

window.addEventListener(
  "load",
  lancerGPS
);

</script>

</body>
</html>
```
