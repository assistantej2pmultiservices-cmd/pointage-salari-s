<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="POINTAGE">

  <title>POINTAGE</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: #f5f5f5;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0 20px;
      text-align: center;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .gps {
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #ddd;
      text-align: center;
      font-size: clamp(13px, 3.5vw, 16px);
      line-height: 1.5;
      word-break: break-word;
    }

    .gps.ok {
      border-color: #b8dfc1;
      background: #f1fff4;
    }

    .gps.error {
      border-color: #f0b7b7;
      background: #fff5f5;
    }

    .gps.waiting {
      background: #fffdf0;
      border-color: #eadb91;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;

      border: 1px solid #cfcfcf;
      border-radius: 12px;

      background: #fff;
      color: #222;

      font-size: 16px;
      font-family: inherit;

      -webkit-appearance: none;
      appearance: none;

      outline: none;
    }

    input:focus {
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      min-height: 62px;
      padding: 14px 16px;

      border: 0;
      border-radius: 14px;

      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 800;
      line-height: 1.25;

      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-appearance: none;
      appearance: none;

      transition:
        transform 0.08s ease,
        opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .btn-start {
      background: #19a34a;
      color: #fff;
    }

    .btn-end {
      background: #d93030;
      color: #fff;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }

    .queue {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #ddd;
      text-align: center;
      font-size: 13px;
      color: #555;
    }

    @media (max-width: 380px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        margin-top: 4px;
        margin-bottom: 16px;
      }

      input {
        height: 50px;
      }

      button {
        min-height: 58px;
        font-size: 16px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      body {
        padding-top: max(10px, env(safe-area-inset-top));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      h1 {
        margin: 4px 0 10px;
        font-size: 28px;
      }

      form {
        gap: 9px;
      }

      .buttons {
        gap: 9px;
        margin-top: 4px;
      }

      input {
        height: 46px;
      }

      button {
        min-height: 50px;
      }

      .gps {
        margin-bottom: 10px;
        padding: 9px;
      }
    }

    @media (min-width: 700px) {
      body {
        padding-top: 30px;
      }

      .container {
        padding: 0 10px;
      }
    }
  </style>
</head>
