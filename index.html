<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#2563eb">

<title>Pointage</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

body {
  padding: 15px;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin: 0 0 20px;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  min-height: 50px;
  padding: 12px;
  font-size: 17px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
}

button {
  width: 100%;
  min-height: 58px;
  margin-top: 14px;
  border: 0;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
}

.debut {
  background: #16a34a;
  color: white;
}

.fin {
  background: #dc2626;
  color: white;
}

.sync {
  background: #2563eb;
  color: white;
}

.status {
  margin-top: 18px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  background: #e5e7eb;
}

.online {
  background: #dcfce7;
  color: #166534;
}

.offline {
  background: #fee2e2;
  color: #991b1b;
}

.info {
  margin-top: 15px;
  padding: 12px;
  background: #eff6ff;
  border-radius: 10px;
  font-size: 14px;
}

.pointage {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  font-size: 14px;
}

.small {
  font-size: 11px;
  color: #6b7280;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Pointage</h1>

<label for="nom">NOM</label>
<input
  id="nom"
  type="text"
  autocomplete="family-name"
  placeholder="Nom"
>

<label for="prenom">PRÉNOM</label>
<input
  id="prenom"
  type="text"
  autocomplete="given-name"
  placeholder="Prénom"
>

<label for="site">SITE D’INTERVENTION</label>
<input
  id="site"
  type="text"
  autocomplete="organization"
  placeholder="Site d’intervention"
>

<button
  class="debut"
  onclick="fairePointage('Heure de début de prestation')"
>
🟢 DÉBUT DE PRESTATION
</button>

<button
  class="fin"
  onclick="fairePointage('Heure de fin de prestation')"
>
🔴 FIN DE PRESTATION
</button>

<button
  class="sync"
  onclick="synchroniser()"
>
🔄 SYNCHRONISER
</button>

<div id="statut" class="status">
Initialisation...
</div>

<div class="info">
Les pointages sont enregistrés automatiquement sur le téléphone.
En cas de coupure Internet, ils restent en attente et seront
envoyés dès que la connexion revient.
</div>

<h3>Historique</h3>

<div id="historique">
Aucun pointage.
</div>

</div>
</div>

<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const URL_GOOGLE_SHEETS =
"https://script.google.com/macros/s/AKfycbyC7LfKcxuVCyPBZF0g4KGzAi1uno5tTkBh6i9HjYj6lgJqbXwc5FlHlKQscVqS9-60/exec";


/* =====================================================
   STOCKAGE
===================================================== */

const CLE =
"pointages_v_finale_2026";


function obtenirPointages() {
  try {
    return JSON.parse(
      localStorage.getItem(CLE) || "[]"
    );
  } catch (e) {
    return [];
  }
}


function sauvegarderPointages(liste) {
  localStorage.setItem(
    CLE,
    JSON.stringify(liste)
  );
}


/* =====================================================
   ID
===================================================== */

function genererId() {
  return "POINTAGE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10);
}


/* =====================================================
   STATUT
===================================================== */

function statut(message, classe = "") {
  const element =
    document.getElementById("statut");

  element.textContent = message;
  element.className =
    "status " + classe;
}


/* =====================================================
   GPS
===================================================== */

function obtenirGPS() {

  return new Promise(resolve => {

    if (!navigator.geolocation) {
      resolve({
        latitude: "",
        longitude: "",
        precision: ""
      });
      return;
    }

    navigator.geolocation.getCurrentPosition(

      position => {

        resolve({
          latitude:
            position.coords.latitude,

          longitude:
            position.coords.longitude,

          precision:
            position.coords.accuracy
        });

      },

      () => {

        resolve({
          latitude: "",
          longitude: "",
          precision: ""
        });

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 30000
      }
    );
  });
}


/* =====================================================
   CREATION URL
===================================================== */

function construireURL(p) {

  const params =
    new URLSearchParams();

  params.set("nom", p.nom);
  params.set("prenom", p.prenom);
  params.set("site", p.site);
  params.set("type", p.type);

  params.set(
    "latitude",
    p.latitude || ""
  );

  params.set(
    "longitude",
    p.longitude || ""
  );

  params.set(
    "precision",
    p.precision || ""
  );

  params.set(
    "commune",
    p.commune || ""
  );

  params.set(
    "id",
    p.id
  );

  params.set(
    "dateHeureMs",
    p.dateHeureMs
  );

  params.set(
    "_",
    Date.now()
  );

  return URL_GOOGLE_SHEETS +
    "?" +
    params.toString();
}


/* =====================================================
   ENVOI
===================================================== */

function envoyer(p) {

  return new Promise(resolve => {

    const iframe =
      document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src =
      construireURL(p);

    document.body.appendChild(
      iframe
    );

    /*
      On laisse suffisamment de temps
      à Google Apps Script pour recevoir
      la requête.
    */

    setTimeout(() => {

      iframe.remove();

      resolve(true);

    }, 3000);
  });
}


/* =====================================================
   POINTAGE
===================================================== */

async function fairePointage(type) {

  const nom =
    document.getElementById("nom")
      .value
      .trim();

  const prenom =
    document.getElementById("prenom")
      .value
      .trim();

  const site =
    document.getElementById("site")
      .value
      .trim();


  if (!nom) {
    alert("Veuillez saisir le NOM.");
    return;
  }

  if (!prenom) {
    alert("Veuillez saisir le PRÉNOM.");
    return;
  }

  if (!site) {
    alert(
      "Veuillez saisir le SITE D’INTERVENTION."
    );
    return;
  }


  statut(
    "📍 Récupération du GPS..."
  );


  const gps =
    await obtenirGPS();


  const maintenant =
    new Date();


  const p = {

    id:
      genererId(),

    dateHeureMs:
      maintenant.getTime(),

    nom:
      nom,

    prenom:
      prenom,

    site:
      site,

    type:
      type,

    latitude:
      gps.latitude,

    longitude:
      gps.longitude,

    precision:
      gps.precision,

    commune:
      "",

    envoye:
      false
  };


  /*
    Sauvegarde IMMÉDIATE.
  */

  const liste =
    obtenirPointages();

  liste.push(p);

  sauvegarderPointages(
    liste
  );

  afficherHistorique();


  /*
    Si Internet est disponible :
    envoi immédiat.
  */

  if (navigator.onLine) {

    await synchroniser();

  } else {

    statut(
      "📴 Enregistré hors connexion",
      "offline"
    );
  }
}


/* =====================================================
   SYNCHRONISATION
===================================================== */

let synchro = false;


async function synchroniser() {

  if (synchro) return;

  if (!navigator.onLine) {

    statut(
      "📴 Hors connexion — pointage conservé",
      "offline"
    );

    return;
  }


  synchro = true;


  const liste =
    obtenirPointages();


  for (
    let i = 0;
    i < liste.length;
    i++
  ) {

    const p =
      liste[i];


    if (p.envoye === true) {
      continue;
    }


    statut(
      "☁️ Enregistrement dans Google Sheets...",
      "online"
    );


    /*
      Envoi GET vers Apps Script.
    */

    await envoyer(p);


    /*
      Le serveur possède son propre
      anti-doublon par ID.
    */

    p.envoye = true;

    sauvegarderPointages(
      liste
    );
  }


  synchro = false;


  afficherHistorique();


  const attente =
    liste.filter(
      p => !p.envoye
    ).length;


  if (attente > 0) {

    statut(
      "🟠 " +
      attente +
      " pointage(s) en attente"
    );

  } else {

    statut(
      "🟢 Pointages enregistrés",
      "online"
    );
  }
}


/* =====================================================
   HISTORIQUE
===================================================== */

function afficherHistorique() {

  const zone =
    document.getElementById(
      "historique"
    );


  const liste =
    obtenirPointages();


  if (!liste.length) {

    zone.textContent =
      "Aucun pointage.";

    return;
  }


  zone.innerHTML = "";


  liste
    .slice()
    .reverse()
    .slice(0, 20)
    .forEach(p => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "pointage";


      const date =
        new Date(
          p.dateHeureMs
        );


      div.innerHTML =

        "<strong>" +
        p.type +
        "</strong><br>" +

        p.nom +
        " " +
        p.prenom +
        "<br>" +

        "Site : " +
        p.site +
        "<br>" +

        date.toLocaleString(
          "fr-FR"
        ) +
        "<br>" +

        (
          p.envoye
            ? "🟢 Enregistré"
            : "🟠 En attente"
        ) +

        "<div class='small'>" +
        p.id +
        "</div>";


      zone.appendChild(div);
    });
}


/* =====================================================
   INTERNET
===================================================== */

window.addEventListener(
  "online",
  function() {

    statut(
      "🟢 Connexion retrouvée — synchronisation...",
      "online"
    );

    synchroniser();
  }
);


window.addEventListener(
  "offline",
  function() {

    statut(
      "📴 Hors connexion — sauvegarde locale active",
      "offline"
    );
  }
);


/* =====================================================
   SERVICE WORKER
===================================================== */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(
          erreur => console.log(
            "Service Worker :",
            erreur
          )
        );
    }
  );
}


/* =====================================================
   DEMARRAGE
===================================================== */

afficherHistorique();

if (navigator.onLine) {
  synchroniser();
} else {
  statut(
    "📴 Hors connexion — sauvegarde locale active",
    "offline"
  );
}

</script>

</body>
</html>
