<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#2563eb">

<title>Pointage</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

body {
  padding: 15px;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin: 0 0 20px;
  font-size: 26px;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  min-height: 50px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  padding: 12px;
  font-size: 17px;
  background: white;
}

button {
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 12px;
  margin-top: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.btn-debut {
  background: #16a34a;
  color: white;
}

.btn-fin {
  background: #dc2626;
  color: white;
}

.btn-sync {
  background: #2563eb;
  color: white;
}

button:disabled {
  opacity: .5;
}

.status {
  margin-top: 18px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  background: #e5e7eb;
}

.online {
  background: #dcfce7;
  color: #166534;
}

.offline {
  background: #fee2e2;
  color: #991b1b;
}

.info {
  margin-top: 15px;
  padding: 12px;
  background: #eff6ff;
  border-radius: 10px;
  font-size: 14px;
}

.historique {
  margin-top: 20px;
}

.pointage {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  font-size: 14px;
}

.small {
  font-size: 12px;
  color: #6b7280;
}

</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Pointage</h1>

    <label for="nom">NOM</label>
    <input
      id="nom"
      type="text"
      autocomplete="family-name"
      placeholder="Nom"
    >

    <label for="prenom">PRÉNOM</label>
    <input
      id="prenom"
      type="text"
      autocomplete="given-name"
      placeholder="Prénom"
    >

    <label for="site">SITE D’INTERVENTION</label>
    <input
      id="site"
      type="text"
      autocomplete="organization"
      placeholder="Site d’intervention"
    >

    <button
      class="btn-debut"
      onclick="fairePointage('Heure de début de prestation')"
    >
      🟢 DÉBUT DE PRESTATION
    </button>

    <button
      class="btn-fin"
      onclick="fairePointage('Heure de fin de prestation')"
    >
      🔴 FIN DE PRESTATION
    </button>

    <button
      class="btn-sync"
      onclick="synchroniser()"
    >
      🔄 SYNCHRONISER
    </button>

    <div
      id="statut"
      class="status"
    >
      Initialisation...
    </div>

    <div class="info">
      Les pointages effectués sans Internet sont conservés
      automatiquement sur le téléphone et seront envoyés
      dès que la connexion revient.
    </div>

    <div class="historique">

      <h3>Historique local</h3>

      <div id="historique">
        Aucun pointage.
      </div>

    </div>

  </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const URL_GOOGLE_SHEETS =
"https://script.google.com/macros/s/AKfycbz4HpbPBEMQBk3ApqjRVQmRAXqQmamlAj2eQEolYRyhpl41Ccy-Q-kr-5H7vinhC9j1kA/exec";

const CLE_POINTAGES = "pointages_v_finale_2026";


/* =========================================================
   OUTILS
========================================================= */

function obtenirPointages() {

  try {

    return JSON.parse(
      localStorage.getItem(CLE_POINTAGES) || "[]"
    );

  } catch (e) {

    return [];
  }
}


function sauvegarderPointages(pointages) {

  localStorage.setItem(
    CLE_POINTAGES,
    JSON.stringify(pointages)
  );
}


function genererId() {

  return "POINTAGE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10);
}


function afficherStatut(message, classe) {

  const element =
    document.getElementById("statut");

  element.textContent = message;

  element.className =
    "status " + (classe || "");
}


/* =========================================================
   RESEAU
========================================================= */

function afficherEtatConnexion() {

  if (navigator.onLine) {

    afficherStatut(
      "🟢 Connecté à Internet",
      "online"
    );

  } else {

    afficherStatut(
      "🔴 Hors connexion — sauvegarde locale active",
      "offline"
    );
  }
}


/* =========================================================
   GPS
========================================================= */

function obtenirGPS() {

  return new Promise(function(resolve) {

    if (!navigator.geolocation) {

      resolve({
        latitude: "",
        longitude: "",
        precision: ""
      });

      return;
    }

    navigator.geolocation.getCurrentPosition(

      function(position) {

        resolve({

          latitude:
            position.coords.latitude,

          longitude:
            position.coords.longitude,

          precision:
            position.coords.accuracy

        });

      },

      function() {

        // GPS refusé ou indisponible :
        // le pointage continue quand même.

        resolve({

          latitude: "",
          longitude: "",
          precision: ""

        });

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 30000
      }
    );
  });
}


/* =========================================================
   POINTAGE
========================================================= */

async function fairePointage(type) {

  const nom =
    document.getElementById("nom")
      .value
      .trim();

  const prenom =
    document.getElementById("prenom")
      .value
      .trim();

  const site =
    document.getElementById("site")
      .value
      .trim();

  if (!nom) {

    alert("Veuillez saisir le NOM.");

    return;
  }

  if (!prenom) {

    alert("Veuillez saisir le PRÉNOM.");

    return;
  }

  if (!site) {

    alert("Veuillez saisir le SITE D’INTERVENTION.");

    return;
  }

  afficherStatut(
    "📍 Récupération de la position GPS...",
    ""
  );

  const gps = await obtenirGPS();

  const maintenant = new Date();

  const pointage = {

    id: genererId(),

    dateHeureMs:
      maintenant.getTime(),

    nom: nom,

    prenom: prenom,

    site: site,

    type: type,

    latitude:
      gps.latitude,

    longitude:
      gps.longitude,

    precision:
      gps.precision,

    commune: "",

    debutEnvoye: false,

    finEnvoyee: false,

    creeLe:
      maintenant.toISOString()

  };

  let pointages =
    obtenirPointages();

  /*
    Pour une FIN, on ne bloque PAS l'envoi
    si le début local n'existe pas.

    Le serveur Google recherche lui-même
    le dernier début ouvert.
  */

  pointages.push(pointage);

  sauvegarderPointages(pointages);

  afficherHistorique();

  if (navigator.onLine) {

    await synchroniser();

  } else {

    afficherStatut(
      "📴 Pointage enregistré hors connexion",
      "offline"
    );
  }

  // Effacement des champs après pointage
  // uniquement si souhaité.
  //
  // On garde ici les champs pour éviter
  // de devoir les ressaisir.
}


/* =========================================================
   CREATION URL
========================================================= */

function creerUrlPointage(pointage) {

  const params =
    new URLSearchParams();

  params.set(
    "action",
    "pointage"
  );

  params.set(
    "nom",
    pointage.nom
  );

  params.set(
    "prenom",
    pointage.prenom
  );

  params.set(
    "site",
    pointage.site
  );

  params.set(
    "type",
    pointage.type
  );

  params.set(
    "latitude",
    pointage.latitude || ""
  );

  params.set(
    "longitude",
    pointage.longitude || ""
  );

  params.set(
    "precision",
    pointage.precision || ""
  );

  params.set(
    "commune",
    pointage.commune || ""
  );

  params.set(
    "id",
    pointage.id
  );

  params.set(
    "dateHeureMs",
    pointage.dateHeureMs
  );

  params.set(
    "_cache",
    Date.now()
  );

  return URL_GOOGLE_SHEETS +
    "?" +
    params.toString();
}


/* =========================================================
   ENVOI GOOGLE SHEETS
========================================================= */

async function envoyerPointage(pointage) {

  const url =
    creerUrlPointage(pointage);

  /*
    no-cors permet l'envoi vers Google Apps Script
    même si le navigateur ne permet pas de lire
    la réponse.

    Si le réseau est indisponible, fetch rejette
    la requête et le pointage reste en attente.
  */

  const controle =
    new AbortController();

  const timeout =
    setTimeout(
      function() {
        controle.abort();
      },
      15000
    );

  try {

    await fetch(url, {

      method: "GET",

      mode: "no-cors",

      cache: "no-store",

      signal: controle.signal

    });

    clearTimeout(timeout);

    return true;

  } catch (erreur) {

    clearTimeout(timeout);

    return false;
  }
}


/* =========================================================
   SYNCHRONISATION
========================================================= */

let synchronisationEnCours = false;


async function synchroniser() {

  if (synchronisationEnCours) {
    return;
  }

  if (!navigator.onLine) {

    afficherStatut(
      "📴 Hors connexion — les pointages restent enregistrés",
      "offline"
    );

    return;
  }

  synchronisationEnCours = true;

  let pointages =
    obtenirPointages();

  let modifications = false;

  for (let i = 0; i < pointages.length; i++) {

    const pointage =
      pointages[i];

    let doitEnvoyer = false;

    if (
      pointage.type ===
      "Heure de début de prestation"
    ) {

      if (!pointage.debutEnvoye) {
        doitEnvoyer = true;
      }

    } else if (
      pointage.type ===
      "Heure de fin de prestation"
    ) {

      if (!pointage.finEnvoyee) {
        doitEnvoyer = true;
      }
    }

    if (!doitEnvoyer) {
      continue;
    }

    afficherStatut(
      "☁️ Synchronisation...",
      "online"
    );

    const succes =
      await envoyerPointage(pointage);

    if (succes) {

      if (
        pointage.type ===
        "Heure de début de prestation"
      ) {

        pointage.debutEnvoye = true;

      } else {

        pointage.finEnvoyee = true;
      }

      modifications = true;

      sauvegarderPointages(pointages);

    } else {

      // On laisse le pointage en attente.
      // Il sera retenté automatiquement.
      break;
    }
  }

  if (modifications) {

    sauvegarderPointages(pointages);
  }

  synchronisationEnCours = false;

  afficherHistorique();

  const restant =
    pointages.filter(function(p) {

      if (
        p.type ===
        "Heure de début de prestation"
      ) {
        return !p.debutEnvoye;
      }

      return !p.finEnvoyee;

    }).length;

  if (restant > 0) {

    afficherStatut(
      "🟠 " +
      restant +
      " pointage(s) en attente",
      ""
    );

  } else {

    afficherStatut(
      "🟢 Tous les pointages sont synchronisés",
      "online"
    );
  }
}


/* =========================================================
   HISTORIQUE
========================================================= */

function afficherHistorique() {

  const zone =
    document.getElementById("historique");

  const pointages =
    obtenirPointages();

  if (!pointages.length) {

    zone.textContent =
      "Aucun pointage.";

    return;
  }

  const derniers =
    pointages
      .slice()
      .reverse()
      .slice(0, 20);

  zone.innerHTML = "";

  derniers.forEach(function(pointage) {

    const div =
      document.createElement("div");

    div.className =
      "pointage";

    const date =
      new Date(
        pointage.dateHeureMs
      );

    let statut = "";

    if (
      pointage.type ===
      "Heure de début de prestation"
    ) {

      statut =
        pointage.debutEnvoye
          ? "🟢 Envoyé"
          : "🟠 En attente";

    } else {

      statut =
        pointage.finEnvoyee
          ? "🟢 Envoyé"
          : "🟠 En attente";
    }

    div.innerHTML =

      "<strong>" +
      pointage.type +
      "</strong><br>" +

      pointage.nom +
      " " +
      pointage.prenom +
      "<br>" +

      "Site : " +
      pointage.site +
      "<br>" +

      "Date : " +
      date.toLocaleString("fr-FR") +
      "<br>" +

      statut +

      "<div class='small'>" +
      pointage.id +
      "</div>";

    zone.appendChild(div);
  });
}


/* =========================================================
   RECONNEXION AUTOMATIQUE
========================================================= */

window.addEventListener(
  "online",
  function() {

    afficherStatut(
      "🟢 Connexion retrouvée — synchronisation...",
      "online"
    );

    synchroniser();
  }
);


window.addEventListener(
  "offline",
  function() {

    afficherStatut(
      "📴 Hors connexion — sauvegarde locale active",
      "offline"
    );
  }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(erreur) {

          console.log(
            "Service Worker :",
            erreur
          );

        });
    }
  );
}


/* =========================================================
   DEMARRAGE
========================================================= */

afficherEtatConnexion();

afficherHistorique();

if (navigator.onLine) {

  synchroniser();
}

</script>

</body>
</html>
