```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointage salarié</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}

form {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 5px;
  font-size: 16px;
}

button {
  margin-top: 25px;
  background: #1a73e8;
  color: white;
  border: 0;
  border-radius: 6px;
}

#gps, #message {
  margin-top: 15px;
  text-align: center;
}
</style>
</head>

<body>

<form id="form">

<h1>Pointage salarié</h1>

<label>Nom</label>
<input id="nom" required>

<label>Prénom</label>
<input id="prenom" required>

<label>Site</label>
<input id="site" required>

<label>Type de pointage</label>
<select id="type" required>
  <option value="">Choisir</option>
  <option value="Arrivée">Arrivée</option>
  <option value="Départ">Départ</option>
  <option value="Pause début">Pause début</option>
  <option value="Pause fin">Pause fin</option>
</select>

<div id="gps">Recherche GPS...</div>

<button type="submit">ENREGISTRER</button>

<div id="message"></div>

</form>

<script>

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";

let latitude = "";
let longitude = "";
let precision = "";

navigator.geolocation.getCurrentPosition(

  function(position) {

    latitude = position.coords.latitude;
    longitude = position.coords.longitude;
    precision = position.coords.accuracy;

    document.getElementById("gps").textContent =
      "GPS activé ✔";

  },

  function() {

    document.getElementById("gps").textContent =
      "GPS non disponible";

  },

  {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  }
);


document.getElementById("form")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const message =
    document.getElementById("message");

  const donnees = {

    dateHeure: new Date().toISOString(),

    nom:
      document.getElementById("nom").value,

    prenom:
      document.getElementById("prenom").value,

    site:
      document.getElementById("site").value,

    type:
      document.getElementById("type").value,

    latitude: latitude,

    longitude: longitude,

    precision: precision
  };

  message.textContent =
    "Envoi en cours...";

  try {

    await fetch(SERVEUR, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },
      body: JSON.stringify(donnees)
    });

    message.textContent =
      "Pointage enregistré ✔";

    message.style.color = "green";

    document.getElementById("form").reset();

  } catch (error) {

    message.textContent =
      "Erreur d'envoi";

    message.style.color = "red";
  }

});

</script>

</body>
</html>
```
