<title>POINTAGE</title>

<style>

<body>

<div class="container">

<h1>POINTAGE</h1>

<div class="card">

<label for="nom">NOM</label>

<input
  id="nom"
  type="text"
  autocomplete="family-name"
  placeholder="Nom"
>

<label for="prenom">PRÉNOM</label>

<input
  id="prenom"
  type="text"
  autocomplete="given-name"
  placeholder="Prénom"
>

<label for="site">SITE D'INTERVENTION</label>

<input
  id="site"
  type="text"
  autocomplete="off"
  placeholder="Site d'intervention"
>

</div>


<div class="card">

<div class="gps">

<strong>📍 GPS</strong>

<div id="gps">
Recherche de la position...
</div>

</div>

<button
  class="btn-debut"
  data-type="Heure de début de prestation">
🟢 HEURE DE DÉBUT DE PRESTATION
</button>

<button
  class="btn-fin"
  data-type="Heure de fin de prestation">
🔴 HEURE DE FIN DE PRESTATION
</button>

<div id="status" class="status"></div>

<div id="queue" class="queue"></div>

</div>

</div>


<script>

/************************************************************
 * CONFIGURATION
 ************************************************************/

const URL_GOOGLE_SCRIPT =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";

const STORAGE_QUEUE = "pointages";

const STORAGE_GPS = "dernierGPS";


/************************************************************
 * ÉLÉMENTS
 ************************************************************/

const nomInput =
document.getElementById("nom");

const prenomInput =
document.getElementById("prenom");

const siteInput =
document.getElementById("site");

const gpsElement =
document.getElementById("gps");

const statusElement =
document.getElementById("status");

const queueElement =
document.getElementById("queue");


/************************************************************
 * GPS
 ************************************************************/

let positionActuelle = null;


function afficherGPS(position) {

  positionActuelle = {

    latitude:
      position.coords.latitude,

    longitude:
      position.coords.longitude,

    precision:
      position.coords.accuracy

  };

  localStorage.setItem(
    STORAGE_GPS,
    JSON.stringify(positionActuelle)
  );

  gpsElement.innerHTML =
    "Latitude : " +
    positionActuelle.latitude.toFixed(6) +
    "<br>" +
    "Longitude : " +
    positionActuelle.longitude.toFixed(6) +
    "<br>" +
    "Précision : ±" +
    Math.round(positionActuelle.precision) +
    " m";

}


function erreurGPS() {

  const ancien =
    localStorage.getItem(STORAGE_GPS);

  if (ancien) {

    try {

      positionActuelle =
        JSON.parse(ancien);

      gpsElement.innerHTML =
        "📍 Dernière position connue<br>" +
        "Latitude : " +
        Number(positionActuelle.latitude).toFixed(6) +
        "<br>" +
        "Longitude : " +
        Number(positionActuelle.longitude).toFixed(6) +
        "<br>" +
        "Précision : ±" +
        Math.round(positionActuelle.precision || 0) +
        " m";

      return;

    } catch (e) {}

  }

  gpsElement.innerHTML =
    "⚠️ Position GPS indisponible";

}


function demanderGPS() {

  if (!navigator.geolocation) {

    erreurGPS();
    return;

  }

  navigator.geolocation.getCurrentPosition(
    afficherGPS,
    erreurGPS,
    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );

}


demanderGPS();


/************************************************************
 * FILE D'ATTENTE
 ************************************************************/

function getQueue() {

  try {

    return JSON.parse(
      localStorage.getItem(STORAGE_QUEUE) || "[]"
    );

  } catch (e) {

    return [];

  }

}


function saveQueue(queue) {

  localStorage.setItem(
    STORAGE_QUEUE,
    JSON.stringify(queue)
  );

  afficherQueue();

}


function afficherQueue() {

  const queue = getQueue();

  if (queue.length === 0) {

    queueElement.textContent =
      "Synchronisation : OK";

  } else {

    queueElement.textContent =
      queue.length +
      " pointage(s) en attente de synchronisation";

  }

}


/************************************************************
 * ID UNIQUE
 ************************************************************/

function genererID() {

  return (
    "POINTAGE-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );

}


/************************************************************
 * NAVIGATEUR
 ************************************************************/

function getNavigateur() {

  return navigator.userAgent || "";

}


/************************************************************
 * ENVOI
 ************************************************************/

async function envoyerPointage(pointage) {

  try {

    /*
     * no-cors est volontaire :
     * Google Apps Script redirige la requête.
     */

    await fetch(
      URL_GOOGLE_SCRIPT,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(pointage)

      }
    );

    return true;

  } catch (erreur) {

    console.error(erreur);

    return false;

  }

}


/************************************************************
 * SYNCHRONISATION
 ************************************************************/

async function synchroniser() {

  const queue = getQueue();

  if (queue.length === 0) {

    afficherQueue();
    return;

  }

  const restante = [];

  for (const pointage of queue) {

    const ok =
      await envoyerPointage(pointage);

    if (!ok) {

      restante.push(pointage);

    }

  }

  saveQueue(restante);

}


/************************************************************
 * CRÉATION DU POINTAGE
 ************************************************************/

async function fairePointage(type, bouton) {

  const nom =
    nomInput.value.trim();

  const prenom =
    prenomInput.value.trim();

  const site =
    siteInput.value.trim();


  if (!nom) {

    afficherErreur("Veuillez saisir le NOM.");
    nomInput.focus();
    return;

  }


  if (!prenom) {

    afficherErreur("Veuillez saisir le PRÉNOM.");
    prenomInput.focus();
    return;

  }


  if (!site) {

    afficherErreur(
      "Veuillez saisir le SITE D'INTERVENTION."
    );

    siteInput.focus();
    return;

  }


  bouton.disabled = true;


  /*
   * On redemande une position fraîche
   */

  demanderGPS();


  const maintenant =
    Date.now();


  const pointage = {

    id: genererID(),

    dateHeureMs:
      maintenant,

    dateHeure:
      maintenant,

    nom:
      nom,

    prenom:
      prenom,

    type:
      type,

    site:
      site,

    latitude:
      positionActuelle
        ? positionActuelle.latitude
        : "",

    longitude:
      positionActuelle
        ? positionActuelle.longitude
        : "",

    precision:
      positionActuelle
        ? positionActuelle.precision
        : "",

    navigateur:
      getNavigateur()

  };


  /*
   * On met d'abord dans la file locale.
   * Le pointage n'est donc jamais perdu.
   */

  const queue =
    getQueue();

  queue.push(pointage);

  saveQueue(queue);


  afficherAttente(
    "Pointage enregistré sur le téléphone..."
  );


  /*
   * Tentative immédiate
   */

  const ok =
    await envoyerPointage(pointage);


  if (ok) {

    /*
     * Avec no-cors, "ok" signifie que le navigateur
     * a accepté la requête. On retire donc le pointage
     * de la file.
     */

    const nouvelleQueue =
      getQueue().filter(function(p) {
        return p.id !== pointage.id;
      });

    saveQueue(nouvelleQueue);

    afficherOK(
      "✅ Pointage envoyé"
    );

  } else {

    afficherAttente(
      "📴 Hors connexion : pointage conservé et sera envoyé automatiquement."
    );

  }


  bouton.disabled = false;

}


/************************************************************
 * AFFICHAGE
 ************************************************************/

function afficherOK(message) {

  statusElement.className =
    "status ok";

  statusElement.textContent =
    message;

}


function afficherErreur(message) {

  statusElement.className =
    "status error";

  statusElement.textContent =
    message;

}


function afficherAttente(message) {

  statusElement.className =
    "status wait";

  statusElement.textContent =
    message;

}


/************************************************************
 * BOUTONS
 ************************************************************/

document
  .querySelectorAll("button[data-type]")
  .forEach(function(bouton) {

    bouton.addEventListener(
      "click",
      function() {

        fairePointage(
          bouton.dataset.type,
          bouton
        );

      }
    );

  });


/************************************************************
 * SYNCHRONISATION AUTOMATIQUE
 ************************************************************/

window.addEventListener(
  "online",
  function() {

    afficherAttente(
      "🌐 Connexion retrouvée. Synchronisation..."
    );

    synchroniser();

  }
);


setInterval(
  synchroniser,
  30000
);


afficherQueue();

synchroniser();


/************************************************************
 * SERVICE WORKER
 ************************************************************/

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(erreur) {

          console.log(
            "Service Worker :",
            erreur
          );

        });

    }
  );

}

</script>

</body>
</html>
