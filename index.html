<!DOCTYPE html>

<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Pointage</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;

  border-radius:15px;
}

h2{
  text-align:center;
}

#gps{
  padding:18px;
  text-align:center;
  border-radius:10px;
  margin-bottom:20px;
  background:#e8f1ff;
  font-weight:bold;
}

.ok{
  background:#e8f5e9!important;
  color:#176b20;
}

  background:#ffebee!important;
  color:#b00020;
}

  display:block;

  width:100%;
  box-sizing:border-box;

  display:block;

</style>

</head>

<body>

<div class="box">

<h2>📍 POINTAGE</h2>

<div id="gps">
📍 Recherche de votre position...
</div>

<div id="formulaire">

<label>NOM</label>

<input
  id="nom"
  type="text"
  autocomplete="off"
>

<label>PRÉNOM</label>

<input
  id="prenom"
  type="text"
  autocomplete="off"
>

<label>SITE D'INTERVENTION</label>

<input
  id="site"
  type="text"
  autocomplete="off"
>

<label>TYPE DE POINTAGE</label>

<select id="type">

<option value="">
-- Sélectionnez --
</option>

<option value="Heure de début de prestation">
Heure de début de prestation
</option>

<option value="Heure de fin de prestation">
Heure de fin de prestation
</option>

</select>

<div id="message"></div>

</div>

</div>


<script>


/* SERVEUR GOOGLE SHEETS */

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";


/* VARIABLES */

let positionGPS = null;

let communeGPS = null;

let enregistrementLance = false;


/*
 * IMPORTANT :
 *
 * Empêche plusieurs synchronisations
 * de fonctionner en même temps.
 */

let synchronisationEnCours = false;


/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker.register("./sw.js")
      .catch(function(error) {

        console.log(
          "Service Worker :",
          error
        );

      });

  });

}


/* DEMARRAGE */

window.addEventListener("load", function() {

  activerFormulaire();

  lancerGPS();

  synchroniser();

});


/* GPS */

function lancerGPS(){

  const bloc =
    document.getElementById("gps");


  if (!navigator.geolocation){

    bloc.className = "erreur";

    bloc.innerHTML =
      "⚠️ GPS non disponible.<br>" +
      "<small>" +
      "Vous pouvez quand même effectuer le pointage." +
      "</small>";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position){

      positionGPS = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        precision:
          position.coords.accuracy

      };


      bloc.className = "ok";

      bloc.innerHTML =
        "✅ Position GPS enregistrée";


      await rechercherCommune();

    },


    function(error){

      bloc.className = "erreur";


      if(error.code === 1){

        bloc.innerHTML =
          "⚠️ Localisation non autorisée.<br>" +
          "<small>" +
          "Le pointage reste possible sans GPS." +
          "</small>";

      }else{

        bloc.innerHTML =
          "⚠️ Position GPS indisponible.<br>" +
          "<small>" +
          "Le pointage reste possible sans GPS." +
          "</small>";

      }

    },


    {
      enableHighAccuracy:true,
      timeout:30000,
      maximumAge:0
    }

  );

}


/* COMMUNE */

async function rechercherCommune(){

  if(!positionGPS){
    return;
  }


  if(!navigator.onLine){

    communeGPS = null;

    return;

  }


  try{

    const latitude =
      positionGPS.latitude;

    const longitude =
      positionGPS.longitude;


    const url =
      "https://data.geopf.fr/geocodage/reverse?" +
      "lon=" +
      encodeURIComponent(longitude) +
      "&lat=" +
      encodeURIComponent(latitude);


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "Erreur géocodage"
      );

    }


    const data =
      await response.json();


    if(
      data &&
      data.features &&
      data.features.length
    ){

      const propriete =
        data.features[0].properties;


      communeGPS =
        propriete.city ||
        propriete.municipality ||
        propriete.label ||
        null;


      if(communeGPS){

        document.getElementById(
          "gps"
        ).innerHTML =
          "✅ Position GPS enregistrée<br>" +
          "<small>" +
          "Commune : " +
          communeGPS +
          "</small>";

      }

    }

  }catch(error){

    console.log(
      "Commune impossible à déterminer :",
      error
    );

    communeGPS = null;

  }

}


/* FORMULAIRE */

function activerFormulaire(){

  [
    "nom",
    "prenom",
    "site",
    "type"
  ]
  .forEach(function(id){

    const element =
      document.getElementById(id);


    element.addEventListener(
      "input",
      verifier
    );


    element.addEventListener(
      "change",
      verifier
    );

  });

}


/* VERIFICATION */

function verifier(){

  if(enregistrementLance){

    return;

  }


  const nom =
    document
      .getElementById("nom")
      .value
      .trim();


  const prenom =
    document
      .getElementById("prenom")
      .value
      .trim();


  const site =
    document
      .getElementById("site")
      .value
      .trim();


  const type =
    document
      .getElementById("type")
      .value;


  if(
    !nom ||
    !prenom ||
    !site ||
    !type
  ){

    return;

  }


  /*
   * Empêche un deuxième déclenchement
   * du même formulaire.
   */

  enregistrementLance = true;


  /*
   * L'HEURE EST PRISE ICI.
   *
   * Elle ne changera plus lors
   * de la synchronisation.
   */

  const maintenant =
    new Date();


  const datePointage =
    maintenant.toLocaleDateString(
      "fr-FR"
    );


  const heurePointage =
    maintenant.toLocaleTimeString(
      "fr-FR"
    );


  const pointage = {

    date:
      datePointage,

    heure:
      heurePointage,

    dateHeure:
      maintenant.toISOString(),

    nom:
      nom,

    prenom:
      prenom,

    site:
      site,

    type:
      type,

    commune:
      communeGPS ||
      "Commune non déterminée",

    latitude:
      positionGPS
        ? positionGPS.latitude
        : null,

    longitude:
      positionGPS
        ? positionGPS.longitude
        : null,

    precision:
      positionGPS
        ? positionGPS.precision
        : null

  };


  /*
   * STOCKAGE LOCAL
   */

  stocker(pointage);


  document.getElementById(
    "message"
  ).innerHTML =
    "⏳ Pointage enregistré localement...";


  /*
   * Tentative de synchronisation.
   */

  synchroniser();

}


/* INDEXEDDB */

function ouvrirDB(){

  return new Promise(
    function(resolve,reject){

      const request =
        indexedDB.open(
          "POINTAGE_DB",
          1
        );


      request.onupgradeneeded =
        function(event){

          const db =
            event.target.result;


          if(
            !db.objectStoreNames.contains(
              "pointages"
            )
          ){

            db.createObjectStore(
              "pointages",
              {
                keyPath:"id",
                autoIncrement:true
              }
            );

          }

        };


      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };


      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


/* STOCKER */

async function stocker(pointage){

  try{

    const db =
      await ouvrirDB();


    const transaction =
      db.transaction(
        "pointages",
        "readwrite"
      );


    transaction
      .objectStore("pointages")
      .add(pointage);


  }catch(error){

    console.log(
      "Stockage impossible :",
      error
    );

  }

}


/* RECUPERER */

async function recupererPointages(){

  const db =
    await ouvrirDB();


  return new Promise(
    function(resolve,reject){

      const transaction =
        db.transaction(
          "pointages",
          "readonly"
        );


      const request =
        transaction
          .objectStore("pointages")
          .getAll();


      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };


      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


/* SUPPRIMER */

async function supprimer(id){

  const db =
    await ouvrirDB();


  const transaction =
    db.transaction(
      "pointages",
      "readwrite"
    );


  transaction
    .objectStore("pointages")
    .delete(id);

}


/* SYNCHRONISATION */

async function synchroniser(){

  /*
   * PROTECTION ANTI-DOUBLON
   *
   * Si une synchronisation est déjà
   * en cours, on ne fait rien.
   */

  if(synchronisationEnCours){

    return;

  }


  synchronisationEnCours = true;


  try{


    if(!navigator.onLine){

      const message =
        document.getElementById(
          "message"
        );


      if(message){

        message.innerHTML =
          "✅ Pointage enregistré.<br>" +
          "<small>" +
          "Il sera envoyé dès que la connexion revient." +
          "</small>";

      }


      return;

    }


    /*
     * Si le GPS existe mais que la commune
     * n'a pas encore été trouvée,
     * on tente une recherche.
     */

    if(
      positionGPS &&
      !communeGPS
    ){

      await rechercherCommune();

    }


    let liste = [];


    try{

      liste =
        await recupererPointages();

    }catch(error){

      console.log(
        "Lecture IndexedDB impossible",
        error
      );

      return;

    }


    if(!liste.length){

      return;

    }


    /*
     * ENVOI DES POINTAGES
     */

    for(const pointage of liste){

      try{


        /*
         * Si la commune n'était pas connue
         * lors du pointage, on essaie de la
         * déterminer grâce aux coordonnées.
         */

        if(
          (
            !pointage.commune ||
            pointage.commune ===
            "Commune non déterminée"
          ) &&
          pointage.latitude !== null &&
          pointage.longitude !== null
        ){

          try{

            const url =
              "https://data.geopf.fr/geocodage/reverse?" +
              "lon=" +
              encodeURIComponent(
                pointage.longitude
              ) +
              "&lat=" +
              encodeURIComponent(
                pointage.latitude
              );


            const response =
              await fetch(url);


            if(response.ok){

              const data =
                await response.json();


              if(
                data &&
                data.features &&
                data.features.length
              ){

                const propriete =
                  data.features[0].properties;


                pointage.commune =
                  propriete.city ||
                  propriete.municipality ||
                  propriete.label ||
                  pointage.commune;

              }

            }

          }catch(error){

            console.log(
              "Commune non récupérée",
              error
            );

          }

        }


        /*
         * ENVOI GOOGLE SHEETS
         *
         * L'heure contenue dans pointage
         * est celle du moment du pointage.
         */

        await fetch(

          SERVEUR,

          {

            method:"POST",

            mode:"no-cors",

            headers:{

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(pointage)

          }

        );


        /*
         * Une fois l'envoi terminé,
         * suppression locale.
         */

        await supprimer(
          pointage.id
        );


      }catch(error){

        console.log(
          "Envoi impossible",
          error
        );

        break;

      }

    }


    document.getElementById(
      "message"
    ).innerHTML =
      "✅ POINTAGE ENREGISTRÉ AUTOMATIQUEMENT";


  }finally{

    /*
     * Le verrou est libéré ici,
     * même en cas d'erreur.
     */

    synchronisationEnCours = false;

  }

}


/* INTERNET REVIENT */

window.addEventListener(
  "online",
  function(){

    synchroniser();

  }
);


/* SYNCHRONISATION RÉGULIÈRE */

setInterval(
  synchroniser,
  30000
);

</script>

</body>
</html>
