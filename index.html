<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Pointage</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
}

.container {
  max-width: 550px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

#gps {
  margin-bottom: 20px;
  padding: 14px;
  text-align: center;
  background: #e8f5e9;
  color: #087a2f;
  border-radius: 8px;
  font-weight: bold;
}

/* TYPE DE POINTAGE */

.type-title {
  margin-top: 22px;
  font-weight: bold;
}

.type-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 10px;
}

.type-button {
  width: 100%;
  padding: 20px 10px;
  border: 4px solid transparent;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.debut {
  background: #20a844;
}

.fin {
  background: #dc3545;
}

.type-button.selected {
  border-color: #000;
}

.type-button:disabled {
  opacity: 0.6;
}

#message {
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
}

#attente {
  margin-top: 10px;
  text-align: center;
  font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

<h1>📍 POINTAGE</h1>

<div id="gps">
  📍 Recherche de la position GPS...
</div>

<form id="form">

<label for="nom">NOM</label>

<input
  type="text"
  id="nom"
  autocomplete="off"
  required
>


<label for="prenom">PRÉNOM</label>

<input
  type="text"
  id="prenom"
  autocomplete="off"
  required
>


<label for="site">SITE D'INTERVENTION</label>

<input
  type="text"
  id="site"
  autocomplete="off"
  required
>


<div class="type-title">
  TYPE DE POINTAGE
</div>


<div class="type-buttons">

<button
  type="button"
  class="type-button debut"
  data-type="Heure de début de prestation"
>
  🟢 HEURE DE DÉBUT DE PRESTATION
</button>


<button
  type="button"
  class="type-button fin"
  data-type="Heure de fin de prestation"
>
  🔴 HEURE DE FIN DE PRESTATION
</button>

</div>


<div id="message"></div>

<div id="attente"></div>

</form>

</div>


<script>

/* =====================================================
   SERVEUR GOOGLE
===================================================== */

const SERVEUR =
"https://script.google.com/macros/s/AKfycbwq6-57RFAb7Pt9BOL4wIJapZ4mPqfsEXy-yIx1WhkykXrWPbNo0gxoIm4Kj9upf0dj/exec";


/* =====================================================
   GPS
===================================================== */

let gps = {
  latitude: "",
  longitude: "",
  precision: ""
};


/* =====================================================
   SAUVEGARDER GPS
===================================================== */

function sauvegarderGPS() {

  localStorage.setItem(
    "dernierGPS",
    JSON.stringify(gps)
  );

}


/* =====================================================
   CHARGER GPS
===================================================== */

function chargerDernierGPS() {

  try {

    const ancienGPS =
      localStorage.getItem("dernierGPS");

    if (!ancienGPS) {
      return false;
    }

    const position =
      JSON.parse(ancienGPS);

    if (
      position.latitude !== "" &&
      position.longitude !== ""
    ) {

      gps = position;

      return true;
    }

  } catch (erreur) {}

  return false;
}


/* =====================================================
   OBTENIR GPS
===================================================== */

function obtenirGPS() {

  return new Promise(function(resolve) {

    if (!navigator.geolocation) {

      if (chargerDernierGPS()) {

        document.getElementById("gps").textContent =
          "📍 Dernière position GPS conservée";

        resolve(true);

      } else {

        document.getElementById("gps").textContent =
          "❌ GPS non disponible";

        resolve(false);
      }

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        gps.latitude =
          position.coords.latitude;

        gps.longitude =
          position.coords.longitude;

        gps.precision =
          position.coords.accuracy;

        sauvegarderGPS();

        document.getElementById("gps").textContent =
          "✅ Position GPS enregistrée";

        resolve(true);
      },


      function() {

        if (chargerDernierGPS()) {

          document.getElementById("gps").textContent =
            "📍 Dernière position GPS conservée";

          resolve(true);

        } else {

          document.getElementById("gps").textContent =
            "❌ Aucune position GPS disponible";

          resolve(false);
        }

      },


      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 300000
      }

    );

  });

}


/* =====================================================
   STOCKAGE HORS CONNEXION
===================================================== */

function chargerPointages() {

  try {

    return JSON.parse(
      localStorage.getItem("pointages") || "[]"
    );

  } catch (erreur) {

    return [];
  }

}


function sauvegarderPointages(pointages) {

  localStorage.setItem(
    "pointages",
    JSON.stringify(pointages)
  );

}


function afficherAttente() {

  const total =
    chargerPointages().length;

  document.getElementById("attente").textContent =
    total > 0
      ? total + " pointage(s) en attente d'envoi."
      : "";

}


/* =====================================================
   ENVOI GOOGLE SHEETS
===================================================== */

async function envoyerPointage(pointage) {

  await fetch(

    SERVEUR,

    {
      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(pointage)
    }

  );

}


/* =====================================================
   SYNCHRONISATION
===================================================== */

let synchronisationEnCours = false;


async function synchroniser() {

  if (synchronisationEnCours) {
    return;
  }

  if (!navigator.onLine) {

    afficherAttente();

    return;
  }


  synchronisationEnCours = true;


  try {

    let pointages =
      chargerPointages();


    if (pointages.length === 0) {

      afficherAttente();

      return;
    }


    let restants = [];


    for (const pointage of pointages) {

      try {

        await envoyerPointage(pointage);

      } catch (erreur) {

        restants.push(pointage);

      }

    }


    sauvegarderPointages(restants);

    afficherAttente();


  } finally {

    synchronisationEnCours = false;

  }

}


/* =====================================================
   BOUTONS DÉBUT / FIN
   AUCUNE LISTE DÉROULANTE
===================================================== */

document
.querySelectorAll(".type-button")
.forEach(function(button) {


  button.addEventListener(
    "click",
    async function() {


      if (button.disabled) {
        return;
      }


      const nom =
        document
        .getElementById("nom")
        .value
        .trim();


      const prenom =
        document
        .getElementById("prenom")
        .value
        .trim();


      const site =
        document
        .getElementById("site")
        .value
        .trim();


      const type =
        button.dataset.type;


      const message =
        document.getElementById("message");


      /* =========================
         VÉRIFICATION
      ========================= */

      if (!nom || !prenom || !site) {

        message.textContent =
          "❌ Remplissez le nom, prénom et site.";

        message.style.color = "red";

        return;
      }


      button.disabled = true;


      /* =========================
         GPS AVANT ENREGISTREMENT
      ========================= */

      message.textContent =
        "📍 Vérification de la position GPS...";

      message.style.color = "black";


      const gpsOK =
        await obtenirGPS();


      if (!gpsOK) {

        message.textContent =
          "❌ Position GPS impossible.";

        message.style.color = "red";

        button.disabled = false;

        return;
      }


      /* =========================
         POINTAGE
      ========================= */

      const pointage = {

        id:
          Date.now().toString() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 10),

        /* IMPORTANT :
           timestamp numérique
           pour avoir la bonne date/heure */

        dateHeure:
          Date.now(),

        nom:
          nom,

        prenom:
          prenom,

        type:
          type,

        site:
          site,

        latitude:
          gps.latitude,

        longitude:
          gps.longitude,

        precision:
          gps.precision

      };


      /* =========================
         SAUVEGARDE LOCALE
      ========================= */

      let pointages =
        chargerPointages();


      pointages.push(pointage);


      sauvegarderPointages(
        pointages
      );


      /* =========================
         ENVOI AUTOMATIQUE
      ========================= */

      if (navigator.onLine) {

        message.textContent =
          "📤 Enregistrement automatique...";


        await synchroniser();


        message.textContent =
          "✅ POINTAGE ENREGISTRÉ";

      } else {

        message.textContent =
          "📵 HORS CONNEXION : POINTAGE SAUVEGARDÉ";

      }


      message.style.color =
        "green";


      button.classList.add(
        "selected"
      );


      afficherAttente();


      /* =========================
         EFFACER LE FORMULAIRE
      ========================= */

      document
        .getElementById("nom")
        .value = "";


      document
        .getElementById("prenom")
        .value = "";


      document
        .getElementById("site")
        .value = "";


      setTimeout(function() {

        button.classList.remove(
          "selected"
        );

        button.disabled = false;

      }, 1500);

    }

  );

});


/* =====================================================
   RETOUR INTERNET
===================================================== */

window.addEventListener(
  "online",
  function() {

    synchroniser();

  }
);


/* =====================================================
   GPS AU DÉMARRAGE
===================================================== */

if (chargerDernierGPS()) {

  document.getElementById("gps").textContent =
    "📍 Position GPS enregistrée";

}


obtenirGPS();


afficherAttente();


synchroniser();


/* =====================================================
   SERVICE WORKER
===================================================== */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(erreur) {

          console.log(
            "Service Worker :",
            erreur
          );

        });

    }
  );

}

</script>

</body>
</html>
